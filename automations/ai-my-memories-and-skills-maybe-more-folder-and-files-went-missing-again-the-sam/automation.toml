prompt = "DAILY CODEX INTEGRITY AND RECOVERY\n\nSchedule: every day at 10:15 AM Asia/Kuala_Lumpur. Run locally in the Codex desktop environment when it is available.\n\nPURPOSE AND INCIDENT HISTORY\nThe user reported that memories, skills, automations, and other .codex folders repeatedly appeared missing when using the PC, Codex, or VS Code. Do not claim an app caused this without evidence. On 2026-10-19, evidence showed sparse checkout enabled in this worktree and tracked folders omitted. The exact missing tracked files were restored from the active Git version; sparse checkout was then disabled for this worktree. The 10:15 daily check is a safety net, not a substitute for the permanent sparse-checkout fix.\n\nACTIVE LOCATION AND PERMANENT SETUP\nUse only C:\\Users\\user\\.codex after confirming `git -C C:\\Users\\user\\.codex rev-parse --show-toplevel` resolves to that exact root. Record branch, HEAD, `git status --short`, worktree list, and both local/worktree `core.sparseCheckout` values. Sparse checkout must remain false. If it becomes enabled, preserve all present/staged/untracked/user changes, disable it for this exact worktree, and verify all tracked paths materialize. Do not modify another clone or worktree.\n\nHOURLY VERSIONED BACKUP\nA Windows user-level scheduled task named `Codex Protected Data Hourly Backup` runs `C:\\Users\\user\\.codex\\codex-router\\Backup-CodexProtectedData.ps1` hourly while the user is logged in. It creates a new SHA-256 verified snapshot only when protected content, branch, or HEAD changes. Snapshots are under `%LOCALAPPDATA%\\CodexDataRecovery\\Snapshots`; each current snapshot records source root, branch, HEAD, capture time, and file hashes. Check the task exists, its action points to this script, its last result succeeded, and the newest snapshot manifest hashes verify. If the exact task is missing, first confirm no task with that exact name exists, then recreate this same least-privilege hourly task; never create duplicates. The incident baseline under `Documents\\Codex\\2026-10-19\\new-chat\\outputs\\Codex-Recovery\\baseline-2026-10-19` records the earlier missing-content state; keep it immutable and do not use it to restore current files.\n\nDAILY INTEGRITY AND RECOVERY\n1. Compare every `git ls-files` path against the active worktree; enumerate absent, changed, staged, and untracked candidates without printing secret values. Inspect sparse flags, branch/HEAD/reflog, and exact Git history to identify cause.\n2. Check all `.codex` automation definition files and active route targets. Run `codex-router/Audit-CodexRouting.ps1 -Detailed` and `codex-router/Validate-CodexKnowledge.ps1`; report pre-existing findings safely.\n3. Restore only an absent file, never replace a present file or whole directory. Prefer the exact file from current active HEAD. For files not present in HEAD, a snapshot is eligible only when its verified metadata matches the exact active root, branch, and HEAD and its file hash verifies. Never restore from another `.codex` clone, branch, commit/version, or mismatched/undated backup. Never infer or recreate missing knowledge. If exact provenance is unavailable or sources disagree, stop that path and report it for human choice.\n4. Preserve automation IDs, recurrence, and ACTIVE/PAUSED states. Do not create duplicate app automations or resume paused tasks.\n5. Recheck repaired files, all tracked paths, sparse settings, hourly task result, route audit, and Git status against the starting state.\n\nBACKUP PRIVACY\nThe hourly script excludes authentication/session state, SQLite databases, environment files, lock contents, and transient app state. Keep those exclusions. Never print credentials, private dictation/transcription history, session data, or secret-like values. Do not delete snapshots.\n\nREPORT\nSummarize cause with evidence, recovered paths/count and source version, remaining missing/changed paths, sparse mode, hourly backup health and newest verified snapshot, routing/validator results, and any action needing the user. Be clear that checks run only when the local desktop execution environment is available."
