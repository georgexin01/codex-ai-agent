prompt = "Every day at 10:15 AM Asia/Kuala_Lumpur, inspect the complete local Codex repository at C:\\Users\\user\\.codex for files missing, changed, or hidden by Git sparse checkout. This is a local task and requires the Codex desktop app to access the files.\n\nStart by reading the current AGENTS.md. Record `git status --short`, current branch and HEAD, recent reflog entries, whether sparse checkout is enabled, and its included paths. Compare every current `git ls-files` path with the worktree, and compare protected paths with the verified recovery manifests. This catches sparse omissions, accidental deletion, and changes caused by branch switches or resets. For absent tracked paths, inspect `git ls-files -t`, sparse patterns, and Git history to identify the exact cause and recovery source. Inspect active routing targets and run `codex-router/Audit-CodexRouting.ps1 -Detailed`; report existing validator findings without printing secret values.\n\nRecover safely and automatically when an exact cause/source is verified:\n- If tracked files are absent because paths are excluded or marked skip-worktree by sparse checkout, add the smallest containing tracked directories to sparse checkout and verify those exact files materialized. Preserve existing files, local modifications, staged changes, and untracked content; never reset the repository or overwrite present files.\n- If a protected knowledge, skill, router, root-guidance, or automation file is absent but exists in a hash-verified recovery manifest or an exact Git commit/reflog entry, restore only that absent file and verify its hash. If verified sources disagree, do not guess; report the competing source versions.\n- Check every `.codex\\automations\\*\\automation.toml`. Restore a missing definition only from a verified backup or exact Git source. Preserve its saved cadence and ACTIVE/PAUSED state; do not create duplicate scheduler records or resume paused tasks.\n- For absent files without an exact recovery source, do not recreate or overwrite anything. Report their paths and cause when known, and ask me to choose a recovery source.\n\nUse the immutable baseline at C:\\Users\\user\\Documents\\Codex\\2026-10-19\\new-chat\\outputs\\Codex-Recovery\\baseline-2026-10-19 and the automation recovery snapshots under the same Codex-Recovery folder. Verify manifests before restoring. After any recovery, recheck every repaired path, Git status against the starting baseline, and the routing audit. Report recovered, still-missing, sparse-excluded, changed-by-branch-or-reset, and intentionally untouched paths separately. Never expose or copy authentication/config secrets, global state, databases, logs, or session history into backups. Never overwrite or delete a recovery baseline. If protected content is complete but changed, create a new date-stamped snapshot; otherwise skip snapshot creation. Keep the report concise and state exact recovery and verification results."
