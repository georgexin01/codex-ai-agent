prompt = "DAILY CODEX KNOWLEDGE MAINTENANCE\n\n\r\n\r\nPrimary location:\r\nC:\\Users\\user\\.codex\n\n\r\n\r\nMISSION\r\nCarefully maintain and gradually improve my Codex environment.\r\nPerform at most 1–2 small, useful improvements per daily run.\r\n\r\nThe objective is NOT to make the directory smaller.\r\nThe objective is to preserve accumulated knowledge while gradually\r\nimproving accuracy, organization, usefulness, safety, and maintainability.\r\n\r\n=========================================== \n0. FIND THE CORRECT CODEX DIRECTORY\r\n=========================================== \n\r\nStart with:\r\nC:\\Users\\user\\.codex\n\n\r\n\r\nVerify that this is the real active Codex directory before modifying it.\r\n\r\nIf it is incorrect:\r\n- Do not create a replacement blindly.\r\n- Search for the actual active Codex directory.\r\n- Record discovered candidates as Path 2, Path 3, Path 4, Path 5, etc.\r\n- Determine the correct location using configuration/runtime evidence.\r\n- Do not modify uncertain candidate directories.\r\n\r\n===========================================\n1. READ BEFORE ACTING\r\n=========================================== \n\r\nBefore making ANY modification:\r\n\r\n- Inspect the directory structure.\r\n- Read the applicable AGENTS.md and other governing instruction files.\r\n- Read existing principles/rules.\r\n- Understand memories and skills relevant to the proposed change.\r\n- Review existing maintenance/audit history if available.\r\n- Study how this Codex environment has actually been used.\r\n- Preserve the user's established working behavior and preferences.\r\n\r\nNever assume old content is useless simply because it is old.\r\n\r\n=========================================== \n2. PRESERVATION IS THE HIGHEST PRIORITY\r\n=========================================== \n\r\nTreat these as protected knowledge:\r\n\r\n- memories/\r\n- skills/\r\n- AGENTS.md\r\n- principles/rules\r\n- knowledge Markdown files\r\n- user-created instructions\r\n- workflow documentation\r\n- historical information that may affect future Codex behavior\r\n\r\nDEFAULT POLICY = PRESERVE.\r\n\r\nNever automatically:\r\n- delete protected files\r\n- delete protected directories\r\n- empty files\r\n- bulk-rewrite knowledge\r\n- replace an entire document with a shorter version\r\n- remove memories\r\n- remove skills\r\n- merge files when information could be lost\r\n- perform destructive \"cleanup\"\r\n- remove information merely because it appears old\r\n- remove information merely because it appears duplicated\r\n\r\nWhen uncertain: DO NOT MODIFY.\r\n\r\n=========================================== \n3. BACKUP BEFORE CHANGE\r\n=========================================== \n\r\nBefore the first mutation of each run:\r\n\r\nCreate or verify a recoverable snapshot/version.\r\n\r\nPrefer Git/version history when safely available.\r\n\r\nThe previous state must be recoverable before modification.\r\n\r\nNever overwrite the only known copy of knowledge.\r\n\r\n=========================================== \n4. DAILY CHANGE BUDGET\r\n=========================================== \n\r\nMaximum:\r\n1–2 small improvements per day.\r\n\r\nGood examples:\r\n- clarify one confusing instruction\r\n- fix one obsolete path after verifying it\r\n- add one useful safety rule\r\n- improve one skill without removing its existing capabilities\r\n- add documentation for an observed workflow\r\n- fix one small configuration issue\r\n- organize metadata without destroying content\r\n- document a recurring user preference supported by evidence\r\n\r\nBad examples:\r\n- rewrite all memories\r\n- rewrite all skills\r\n- restructure the entire .codex directory\r\n- mass rename\r\n- mass delete\r\n- aggressively deduplicate\r\n- delete \"legacy\" folders\r\n- replace many Markdown files\r\n- perform speculative cleanup\r\n\r\nSmall and correct is better than large and clever.\r\n\r\nIt is acceptable to make ZERO changes if no safe improvement\r\nis justified today.\r\n\r\n=========================================== \n5. LEGACY POLICY\r\n=========================================== \n\r\n\"Legacy\", \"old\", \"unused\", \"duplicate\", and \"deprecated\"\r\nDO NOT mean permission to delete.\r\n\r\nIf potentially obsolete content is discovered:\r\n\r\n1. Preserve it.\r\n2. Document why it may be obsolete.\r\n3. Add it to CANDIDATES.md.\r\n4. Recommend what could eventually be done.\r\n5. Wait for explicit human approval before destructive removal.\r\n\r\n=========================================== \n6. USER BEHAVIOR\r\n=========================================== \n\r\nLearn from existing Codex history, memories, skills, rules,\r\nproject conventions and repeated working patterns.\r\n\r\nPrefer improvements consistent with how the user actually works.\r\n\r\nDo not invent preferences from weak evidence.\r\n\r\nDo not replace established behavior merely because another\r\napproach appears more fashionable.\r\n\r\n=========================================== \n7. CHANGE SAFETY\r\n=========================================== \n\r\nBefore editing ask:\r\n\r\n- Is this change necessary?\r\n- Is it supported by evidence?\r\n- Does it preserve previous useful information?\r\n- Does it follow existing .codex principles?\r\n- Can it be reversed?\r\n- Is it small enough for today's change budget?\r\n\r\nIf any answer is uncertain, skip the modification.\r\n\r\n=========================================== \n8. LARGE CHANGES REQUIRE APPROVAL\r\n=========================================== \n\r\nDo NOT automatically perform a change involving:\r\n\r\n- deletion\r\n- entire folder replacement\r\n- large file rewrites\r\n- moving many files\r\n- changing memory architecture\r\n- changing skill architecture\r\n- significant deduplication\r\n- removing historical knowledge\r\n- irreversible migrations\r\n\r\nInstead document the proposal in CANDIDATES.md for human review.\r\n\r\n=========================================== \n9. VALIDATE\r\n=========================================== \n\r\nAfter modification:\r\n\r\n- compare before/after\r\n- verify protected files still exist\r\n- verify memories were not lost\r\n- verify skills were not lost\r\n- verify no unrelated files changed\r\n- verify existing Codex rules remain respected\r\n- verify the changed content is readable and internally consistent\r\n\r\nIf validation fails:\r\nROLL BACK today's modification.\r\n\r\n=========================================== \n10. AUDIT\r\n=========================================== \n\r\nMaintain a concise daily record containing:\r\n\r\nDate:\r\nCorrect Codex path:\r\nFiles inspected:\r\nBackup/snapshot:\r\nImprovement 1:\r\nImprovement 2:\r\nReason:\r\nValidation:\r\nProtected content changed:\r\nFiles deleted:\r\nFolders deleted:\r\nSuggestions requiring approval:\r\n\r\n\"Files deleted\" and \"Folders deleted\" should normally be NONE.\r\n\r\n=========================================== \nFINAL PRINCIPLE\r\n=========================================== \n\r\nPRESERVE > UNDERSTAND > BACKUP > IMPROVE > VALIDATE.\r\n\r\nNever sacrifice accumulated knowledge for cleanliness.\r\n\r\nMy memories, skills, principles and historical Markdown knowledge\r\nare long-term assets.\r\n\r\nWhen choosing between preserving possibly useful information and\r\ndeleting it, PRESERVE IT."
