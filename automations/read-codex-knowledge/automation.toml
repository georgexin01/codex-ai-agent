prompt = "CONTENT PRESERVATION — mandatory before every action: This social publishing task may read C:\\Users\\user\\.codex\\ but must never create, edit, overwrite, truncate, delete, move, rename, archive, compress, clean, synchronize, reset, or replace any file or folder there. In particular, preserve all skills, memories, rules, routers, configuration, and automation definitions. Do not run knowledge maintenance, cleanup, Git reset/clean/checkout, mirror synchronization, or repair/reinstallation operations as part of posting. Missing files are a blocker: report their exact paths; never reconstruct, replace, or remove content automatically. Any proposed removal of .codex content requires stopping and obtaining separate explicit user confirmation naming every affected path and operation. Automatic application-managed session/runtime records are outside the agent's file-edit scope; never manually clean them. Keep temporary publishing artifacts outside .codex. Keep the existing schedule unchanged.\n\nBefore researching or generating any news-derived post, title, description, summary, or other content based on an article in each run, read and follow C:\\Users\\user\\.codex\\skills\\articles-research-way\\SKILL.md. Apply its evidence and source-verification rules alongside the project workflow below. If the skill file cannot be read, do not draft content; report the blocker.\n\nBefore platform checks in each run, make the ChatGPT right-sidebar browser available: open a fresh browser tab there, and use Ctrl+Shift+B once if the app requires it to enable browser control. Continue in that tab for the checks and publishing. Do not repeat the shortcut if browser control is already available; if the tab or browser control cannot be opened, use an already connected browser if possible and report the blocker.\n\nEach day, create and publish 1–2 distinct public topic posts for Zeta Software, adapting each topic for every connected platform: LinkedIn, Reddit, Medium, X, Facebook, Instagram, and Threads. This means up to two posts per platform in one run, including Instagram and Threads. For Instagram, add a companion Story with a clickable Link sticker for each topic when the Story destination is available, so the article is tappable even if feed-caption links are not enabled.\n\nUse these destinations and the current project material:\n- LinkedIn: https://www.linkedin.com/in/zeta-software-916a9435b/\n- Reddit: https://www.reddit.com/user/Complete_Company7401/submitted/\n- Medium: https://medium.com/new-story\n- X: https://x.com/compose/post\n- Facebook profile: https://www.facebook.com/profile.php?id=61584518385900\n- Instagram: https://www.instagram.com/tech.zeta0001/\n- Threads: https://www.threads.com/@tech.zeta0001\n- Project content and images: D:\\backup\\website-zetasoftware\n\nTreat every run as a new batch. If this automation runs more than once on the same day, create another 1–2 topics; do not impose a daily post cap. Review recent activity on every platform and current project news/blog pages. Avoid copy or a key message substantially the same as a recent post. Reusing a title, topic, or source URL is acceptable when the post adds a materially different angle and useful details.\n\nAt the start of each run, draw one uniform random number u from 0 to 1: English if u < 0.70, Chinese if u < 0.90, otherwise Malay. Use that language for all topics and platform versions in this run; draw again next run.\n\nBefore creating content on each platform, check that the account is signed in and its posting destination is available. If signed out or inaccessible, do not ask for or enter passwords or verification codes. Skip that platform, remind me to sign in, and continue on available platforms. For Reddit, create a post on my profile only. Start from the supplied profile/submitted destination, and verify the composer says “Submit to u/Complete_Company7401” before composing or submitting. If the destination selector opens, choose “u/Complete_Company7401 — Your profile”; never select a subreddit. If the profile option is absent, skip Reddit and report the blocker. Use the Text tab by default. If you try Images & Video, make at most one safe browser upload attempt. If upload is unavailable, return to Text, confirm the prepared title and body are still present, and publish the text/link version. Do not try to submit an empty Images & Video post. Confirm the Post button is enabled, activate it once, then verify the result. If the composer remains with no success or error signal, inspect the profile’s Posts activity before any retry. If the exact item is absent, retry only once by focusing the Post button and pressing Enter; this interaction succeeded when ordinary click did not. Never retry if the post is visible or its status is ambiguous. Treat a Reddit-created URL containing “?created=t3_<id>” (or a success notice) plus the exact post visible in profile activity as verified success; capture the item permalink. If the retry still fails, report the observed blocker.\n\nFor each topic:\n1. Use only useful information supported by a current project article. Verify the exact source article URL opens successfully on zetasoftware.my before drafting.\n2. Find its matching project image when available. Do not invent customer results, claims, or case studies.\n3. Adapt each version to its platform while keeping facts, topic, and selected language consistent:\n   - LinkedIn: concise professional feed copy, exact article link, and a few relevant hashtags.\n   - Reddit: useful, discussion-friendly title and body for the supplied profile.\n   - Medium: concise, readable story with a distinct title, subtitle, useful sections, and exact source link.\n   - X: concise copy within the platform limit, exact source link, and a few relevant hashtags.\n   - Facebook: concise useful feed copy, exact article link, and a few relevant hashtags. Set this post's audience to Public only; never change the account's default audience or future-post settings.\n   - Instagram feed: concise caption with the exact source URL as plain text (no Markdown link syntax and no backslash escape) and a few relevant hashtags; use the matching project image when a safe browser upload path is available. Caption URLs may remain plain text for accounts without Instagram's clickable-caption feature.\n   - Instagram Story: for each topic, create a companion Story with Instagram's native Link sticker set to the exact source article URL when the Story destination is available. Use the matching project image when a safe browser upload path is available; otherwise use a text-only Story background if the platform supports it. Ensure the Story is shared publicly when a per-Story audience option is available; do not change the account's default or future-Story settings. Do not edit or replace profile bio links.\n   - Threads: concise, conversational post with the exact source URL and a few relevant hashtags.\n4. Images are preferred, not required. Make at most one reasonable upload attempt per platform item using the matching project image, and only through a browser upload path that does not open a native OS file picker. Never repeatedly activate upload controls. If a native picker opens unexpectedly, press Escape once, verify the page is restored, then continue without upload. If upload is unavailable, publish the eligible text/link version and report image status. A link preview counts as an image only if the matching article image is visibly shown. On Facebook, if the preview is loading, wait and check once; if the image is still absent, publish the text and link. Medium may publish without an image when upload is unavailable. Try image upload again in a future run.\n5. Publish each eligible platform version without asking me for permission or questions.\n6. After each attempt, verify the platform's success notice and visible public activity for that exact item. For Instagram Stories, verify the Story is visible in the account's public Story activity and its Link sticker opens the exact source URL if safely checkable. Confirm text/topic and source link, record image status, and capture its public permalink or Story link. Never report an attempt as successful without both a success signal and visible activity.\n7. If a platform reports failure or the item does not appear, inspect recent/public activity first. Retry that same item exactly once only if confirmed absent. Do not retry when visible or ambiguous. Verify any retry the same way; report unresolved failure and the observed blocker.\n8. At the end, report each published post/story link, source article link, and whether its image was uploaded, shown in a matching link preview, or omitted. Also list failed/skipped platforms, whether a retry was used, and any platform where I need to sign in.\n\nKeep the existing daily schedule. Do not include AISEO or unrelated sites/campaigns in routine runs.\n\nVerified workflow note (2026-10-01): Medium's earlier publish-limit warning was not permanent; a later attempt succeeded. Check the current account/editor eligibility on each run instead of treating the old warning as a standing block. Before publishing a Medium story, inspect the rendered draft to confirm the full title, subtitle, readable sections, and exact source URL are present; repair any truncation or joined text and inspect again before opening Publish. The verified Medium story in this run published successfully with its source link, but its image was omitted; this confirms the text-publishing flow only, not image upload. Keep the existing one-safe-image-attempt rule, and report image status only from visible evidence. Do not claim all-platform image success unless each platform's matching image is visibly uploaded or shown in a matching preview and the exact post is verified."
