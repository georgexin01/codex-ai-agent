prompt = "CONTENT PRESERVATION — mandatory before every action: This social publishing task may read C:\\Users\\user.codex\\ but must never create, edit, overwrite, truncate, delete, move, rename, archive, compress, clean, synchronize, reset, or replace any file or folder there. In particular, preserve all skills, memories, rules, routers, configuration, and automation definitions. Do not run knowledge maintenance, cleanup, Git reset/clean/checkout, mirror synchronization, or repair/reinstallation operations as part of posting. Missing files are a blocker: report their exact paths; never reconstruct, replace, or remove content automatically. Any proposed removal of .codex content requires stopping and obtaining separate explicit user confirmation naming every affected path and operation. Automatic application-managed session/runtime records are outside the agent's file-edit scope; never manually clean them. Keep temporary publishing artifacts outside .codex. Keep the existing schedule unchanged.\r\nBefore researching or generating any news-derived post, title, description, summary, or other content based on an article in each run, read and follow C:\\Users\\user.codex\\skills\\articles-research-way\\SKILL.md. Apply its evidence and source-verification rules alongside the project workflow below. If the skill file cannot be read, do not draft content; report the blocker.\r\nAt the start of each run, after reading the required articles-research-way skill and before article research or platform checks, prepare the ChatGPT right-sidebar browser and verify browser control with a harmless page observation. Open a fresh browser tab there. If the browser pane is hidden, use Ctrl+Shift+B once to show it; this shortcut only shows or hides the browser/split view and does not itself enable or repair browser control. Do not repeat the shortcut if the pane is already visible. If browser control fails, make one recovery attempt using the app's supported browser controls, then test once more. If it still fails or no fresh tab can be opened, stop before platform checks or publishing and report the blocker; do not claim account sign-in status.\r\nEach day, create and publish 1–2 distinct public topic posts for Zeta Software, adapting each topic for every connected platform: LinkedIn, Reddit, Medium, X, Facebook, Instagram, Threads, Flipboard, Bluesky, Quora, Tumblr, Substack, and Pinterest. This means up to two posts per platform in one run. For Instagram, add a companion Story with a clickable Link sticker for each topic when the Story destination is available, so the article is tappable even if feed-caption links are not enabled.\r\nUse these destinations and the current project material:\r\n- LinkedIn: https://www.linkedin.com/in/zeta-software-916a9435b/\r\n- Reddit: https://www.reddit.com/user/Complete_Company7401/submitted/\r\n- Medium: https://medium.com/new-story\r\n- X: https://x.com/compose/post\r\n- Facebook profile: https://www.facebook.com/profile.php?id=61584518385900\r\n- Instagram: https://www.instagram.com/tech.zeta0001/\r\n- Threads: https://www.threads.com/@tech.zeta0001\r\n- Flipboard: https://flipboard.com/profile\r\n- Bluesky: https://bsky.app/profile/zetasoftware.bsky.social\r\n- Quora: https://www.quora.com/following\r\n- Tumblr: https://www.tumblr.com/\r\n- Substack: https://substack.com/@zetasoftware\r\n- Pinterest: https://www.pinterest.com/techzeta0001/\r\n- Project content and images: D:\\backup\\website-zetasoftware\n\n\r\nTreat every run as a new batch. If this automation runs more than once on the same day, create another 1–2 topics; do not impose a daily post cap. Review recent activity on every platform and current project news/blog pages. Also inspect the latest Medium story and Reddit profile post for their topic, structure, and recent wording; use them only to understand recent activity and useful format, never copy their text or key message. Avoid copy or a key message substantially the same as a recent post. Reusing a title, topic, or source URL is acceptable when the post adds a materially different angle and useful details.\r\nAt the start of each run, draw one uniform random number u from 0 to 1: English if u < 0.70, Chinese if u < 0.90, otherwise Malay. Use that language for all topics and platform versions in this run; draw again next run.\r\nIf a supplied platform destination fails to open, skip it for this run, continue with available platforms, record the blocker, and recheck it next run. If a selected Zeta article URL fails to open, do not repeatedly retry it; use the LOCAL PROJECT ARTICLE FALLBACK below. If an optional external news source fails to open, skip that source and continue without it.\nFor every listed platform URL, make one direct opening/readiness attempt during the run. If it opens and the account and posting destination are available, make one initial publishing attempt for each selected topic on that site; do not skip a reachable, eligible site without trying its post. If a site URL is inaccessible, skip it and continue with the others. Apply the existing single-retry rule only after checking that a failed post is definitely absent; never retry an item that is visible or ambiguous.\nBefore creating content on each platform, check that the account is signed in and its posting destination is available. If Bluesky is signed out, and the username and password fields are already autofilled for the visibly correct account, click the existing Log in button once. Do not read, copy, change, or manually enter credentials. If the fields are not already filled, the account is unclear, or any CAPTCHA, verification code, security prompt, or other challenge appears, stop and skip Bluesky; do not bypass it. For every other platform, including Instagram, if signed out or inaccessible, do not ask for or enter passwords or verification codes. Skip that platform, remind me to sign in, and continue on available platforms. For Reddit, create a post on my profile only. Start from the supplied profile/submitted destination, and verify the composer says “Submit to u/Complete_Company7401” before composing or submitting. If the destination selector opens, choose “u/Complete_Company7401 — Your profile”; never select a subreddit. If the profile option is absent, skip Reddit and report the blocker. Use the Text tab by default. If you try Images & Video, make at most one safe browser upload attempt. If upload is unavailable, return to Text, confirm the prepared title and body are still present, and publish the text/link version. Do not try to submit an empty Images & Video post. Confirm the Post button is enabled, activate it once, then verify the result. If the composer remains with no success or error signal, inspect the profile’s Posts activity before any retry. If the exact item is absent, retry only once by focusing the Post button and pressing Enter; this interaction succeeded when ordinary click did not. Never retry if the post is visible or its status is ambiguous. Treat a Reddit-created URL containing “?created=t3_<id>” (or a success notice) plus the exact post visible in profile activity as verified success; capture the item permalink. If the retry still fails, report the observed blocker.\r\nLOCAL NEWS + ZETA ARTICLE PAIRING (optional, evidence-led)\r\nSometimes build a topic by pairing a timely Johor Bahru/Johor-area news story with a directly related current Zeta Software blog article. Do this only when the connection is useful and factual; otherwise use a Zeta-only topic. Before drafting, open and verify both exact URLs. For the news source, prefer an official authority or the original publisher; note its publisher, date if shown, location, and exactly what it supports. Distinguish proposed/planned work from work already completed, and separate reported news facts from Zeta's advice. Adapt each platform version to explain the connection and include both the exact news URL and the exact Zeta blog URL, including the Medium story and Reddit post. Keep reported news facts separate from Zeta's advice. Never imply that the news proves customer outcomes, increased footfall, or a causal business result. A useful recent example is the verified pairing of a Johor Bahru city-centre pedestrian/micromobility plan with Zeta's visitor-information guide: use the local update as context, then give businesses practical checks for hours, map location, access, language, next steps, and measurable actions. Treat that as a pattern, not copy to repeat; review recent activity and add a materially different angle.\r\nLOCAL PROJECT ARTICLE FALLBACK (required when the live Zeta site is unavailable)\r\nIf zetasoftware.my or a selected Zeta article URL cannot be opened in the in-app browser, do not stop solely for that reason. Use D:\\\\backup\\\\website-zetasoftware directly: consult the canonical blog/news inventory, then inspect only the selected article's matching generated page and its metadata. Confirm the page is published, not a draft or future-dated, and that its article content matches the catalog title, excerpt and date. Obtain the exact public article URL from that page's canonical link or JSON-LD mainEntityOfPage (or an explicit URL in the canonical catalog); never construct or guess it from a slug. Treat the local page as evidence of what Zeta published, but clearly record that the live article URL could not be verified and do not claim it opened. Preserve the exact canonical URL in social posts. If the local article page is missing, inconsistent, unpublished, future-dated, or has no explicit canonical URL, skip that source and report the exact blocker. This fallback applies only to Zeta-authored project articles; any optional external news source and any time-sensitive external claim still require live source verification under the article-research skill. Omit external claims that cannot be verified.\r\n\r\nFor each topic:\r\n1. Use only useful information supported by a current project article. Try to verify the exact source article URL on zetasoftware.my before drafting; if it cannot be opened, apply the LOCAL PROJECT ARTICLE FALLBACK above.\r\n2. Find its matching project image when available. Do not invent customer results, claims, or case studies.\r\n3. Adapt each version to its platform while keeping facts, topic, and selected language consistent:\r\n   - LinkedIn: concise professional feed copy, exact article link, and a few relevant hashtags.\r\n   - Reddit: useful, discussion-friendly title and body for the supplied profile.\r\n   - Medium: concise, readable story with a distinct title, subtitle, useful sections, and exact source link.\r\n   - X: concise copy within the platform limit, exact source link, and a few relevant hashtags.\r\n   - Facebook: concise useful feed copy, exact article link, and a few relevant hashtags. Set this post's audience to Public only; never change the account's default audience or future-post settings.\r\n   - Instagram feed: concise caption with the exact source URL as plain text (no Markdown link syntax and no backslash escape) and a few relevant hashtags; use the matching project image when a safe browser upload path is available. Caption URLs may remain plain text for accounts without Instagram's clickable-caption feature.\r\n   - Instagram Story: for each topic, create a companion Story with Instagram's native Link sticker set to the exact source article URL when the Story destination is available. Use the matching project image when a safe browser upload path is available; otherwise use a text-only Story background if the platform supports it. Ensure the Story is shared publicly when a per-Story audience option is available; do not change the account's default or future-Story settings. Do not edit or replace profile bio links.\r\n   - Threads: concise, conversational post with the exact source URL and a few relevant hashtags.\r\n   - Flipboard: create a magazine post/story from the supplied profile, with a clear title, useful summary, exact Zeta article link, and (when paired) the exact local-news link. Add it only to a suitable Zeta Software-owned magazine; if no owned magazine or posting destination is available, skip and report it. Do not create or post into an unrelated magazine.\r\n   - Bluesky: write a concise post within the current platform limit, with the exact source URL and a few relevant hashtags when space allows.\r\n   - Quora: use the profile's Add Question flow to select its Create Post option when available, then publish an informative, discussion-friendly profile post with the exact source link(s). Do not submit to a Space or community. If only a question or community destination is available, skip and report the blocker.\r\n   - Tumblr: create a text post with a distinct title, readable body, exact source link(s), and a few relevant tags; use the matching project image when the safe upload path is available.\r\n   - Substack: create an Article (not a Note) on the supplied profile, with a distinct title, subtitle, useful readable sections, and exact source link(s). Inspect the rendered draft before publishing. Keep account-level publication, audience, and subscriber settings unchanged.\r\n   - Pinterest: create a Pin with a clear title, useful description, exact Zeta article destination URL, and the matching project image when a safe upload path is available. Save it to a relevant Zeta Software board. If no suitable board exists and Pinterest requires one, create one relevant public board once and reuse it; do not create duplicate boards.\r\n4. Images are preferred, not required. Make at most one reasonable upload attempt per platform item using the matching project image, and only through a browser upload path that does not open a native OS file picker. Never repeatedly activate upload controls. If a native picker opens unexpectedly, press Escape once, verify the page is restored, then continue without upload. If upload is unavailable, publish the eligible text/link version and report image status. A link preview counts as an image only if the matching article image is visibly shown. On Facebook, if the preview is loading, wait and check once; if the image is still absent, publish the text and link. Medium may publish without an image when upload is unavailable. Try image upload again in a future run.\r\n5. Publish each eligible platform version without asking me for permission or questions.\r\n6. After each attempt, verify the platform's success notice and visible public activity for that exact item. For Instagram Stories, verify the Story is visible in the account's public Story activity and its Link sticker opens the exact source URL if safely checkable. Confirm text/topic and source link, record image status, and capture its public permalink or Story link. Never report an attempt as successful without both a success signal and visible activity.\r\n7. If a platform reports failure or the item does not appear, inspect recent/public activity first. Retry that same item exactly once only if confirmed absent. Do not retry when visible or ambiguous. Verify any retry the same way; report unresolved failure and the observed blocker.\r\n8. At the end, report each published post/story link, source article link, and whether its image was uploaded, shown in a matching link preview, or omitted. Also list failed/skipped platforms, whether a retry was used, and any platform where I need to sign in.\r\nKeep the existing daily schedule. Do not include AISEO or unrelated sites/campaigns in routine runs.\r\nVerified workflow note (2026-10-01): Medium's earlier publish-limit warning was not permanent; a later attempt succeeded. Check the current account/editor eligibility on each run instead of treating the old warning as a standing block. Before publishing a Medium story, inspect the rendered draft to confirm the full title, subtitle, readable sections, and exact source URL are present; repair any truncation or joined text and inspect again before opening Publish. The verified Medium story in this run published successfully with its source link, but its image was omitted; this confirms the text-publishing flow only, not image upload. Keep the existing one-safe-image-attempt rule, and report image status only from visible evidence. Do not claim all-platform image success unless each platform's matching image is visibly uploaded or shown in a matching preview and the exact post is verified.\n\nSEQUENTIAL PLATFORM RUN (required): After the browser preflight, handle the numbered platform destinations strictly one at a time in the listed order. For each destination, open its exact URL, observe that the page loaded, inspect recent activity and the posting destination, and confirm the account is available before drafting. Then prepare and publish the selected topic for that site, make at most one safe image-upload attempt, fall back to text/link when that format allows if upload fails, and verify the success signal plus the exact item in public activity before moving to the next site. Keep a simple progress checklist; a failed, inaccessible, signed-out, or unsupported site must be recorded and skipped so later sites are still processed. Do not open/check several destinations in parallel or defer all publishing until after visiting them. The user has expressly authorized routine publication to the listed accounts for this Zeta Software promotional purpose without per-post approval; proceed without asking routine confirmation, while still respecting platform constraints and never entering credentials or bypassing security checks. Make one initial post per selected topic on every reachable, signed-in, eligible destination. Apply the existing one-time retry rule only after confirming the exact post is absent; never retry a visible or ambiguous result. Preserve the existing schedule timing, ACTIVE status, target thread, and all other prompt guidance.\n\nRECENT PROJECT ARTICLE SHORTLIST (required):\nFor topic selection, use the current project inventory at D:\\backup\\website-zetasoftware to identify the newest published Zeta Software articles. Read the canonical blog/news index or catalog and only the records needed to rank candidates; do not crawl or open every historical article page. Build a newest-first shortlist of no more than the 30 most recent published articles, using each item's explicit publication/release date first, then its post date, then its created date when earlier fields are absent. Exclude drafts and future-dated items. Do not substitute file-modified timestamps for article dates. If fewer than 30 dated published items exist, use the available items and report the count/date limitation.\nSelect the run's 1–2 distinct topic sources from this shortlist based on freshness, usefulness, evidence quality, and difference from recent social posts. Use the article title, excerpt, date, and catalog metadata to screen candidates; open and verify the exact project article URL only for each selected source before drafting. Do not research or summarize all 30 articles, and do not search the full archive for additional topics. For optional local-news pairings, research only the exact news source and its selected, directly related Zeta article; do not conduct a broad crawl of news or older blog pages. If the canonical project inventory cannot be located, report the precise blocker and skip the source. If the live selected Zeta article URL cannot be verified, use the LOCAL PROJECT ARTICLE FALLBACK above; skip only when its local-page conditions are not met, and never guess a URL.\n\nPOST-FAILURE DIAGNOSIS AND RECOVERY\n- After activating Publish/Post, if the button is disabled, shows a spinner, or the composer still indicates processing, wait for a visible terminal success or error signal before taking another action. Do not press or click again while processing.\n- After a success signal, verify the exact item in public activity and capture its permalink. If it is visible, do not retry. If the outcome remains ambiguous, do not retry.\n- If no terminal success appears, inspect the exact public activity before retrying. Retry only when the exact item is definitely absent, and make no more than one retry per platform item in that run. A prior retry counts; never exceed that limit.\n- Record the exact visible error or pending state. Do not claim a root cause unless the page provides evidence for it. A missing link preview is not a posting failure when the platform explicitly allows posting the text and URL; report the preview/image status.\n- Medium: wait until the editor visibly reports the draft is saved. Before publishing, inspect the rendered preview for the complete title, subtitle, readable sections, and exact source URL. If saving fails or text is truncated, correct the draft and confirm it is saved before publishing; otherwise report the visible error and do not publish malformed content.\n- Flipboard: use only a suitable Zeta Software-owned magazine. Confirm title, summary, and exact URL before flipping. If an error appears, check public Flips activity before any permitted retry; never use an unrelated magazine.\n- Pinterest: make at most one safe browser file-chooser upload attempt with the matching project image. If the browser does not expose a file chooser or the Pin requires media, do not reopen the upload control or submit an empty Pin; record the blocker and skip that item.\n\nREQUIRED FINAL 13-PLATFORM STATUS TABLE (every run)\nAt the end of every daily batch, include one comparison table with exactly one row for each of the 13 listed platforms, in the existing order: LinkedIn, Reddit, Medium, X, Facebook, Instagram, Threads, Flipboard, Bluesky, Quora, Tumblr, Substack, Pinterest. Use columns Platform, Action / outcome, Status. Mark verified published posts with ✓, failed or unresolved attempted posts with ✗, and skipped, inaccessible, signed-out, unsupported, or user-paused platforms with ℹ. For each published item, include its public permalink, source article URL, and visible image status (uploaded, matching preview shown, or omitted). For failures/skips, state the observed reason and whether the one allowed retry was used. Distinguish a successful publish from an attempted or ambiguous result; never mark success without both a success signal and the exact item visible in public activity. If Instagram is temporarily paused at the user's direction, record it as ℹ temporarily skipped. Include all 13 rows even when a platform was unavailable or not eligible.\n\nPLATFORM FAILURE LEARNINGS AND SAFE PREVENTION (verified 2026-10-14)\n- Tumblr: the user signed into the Zeta Software blog, and the email DNS sender-map text post was published and verified. Check the account and blog selection fresh each run; do not carry forward an old signed-out result. Verified post: https://www.tumblr.com/zetasoftware/830445102907441152/map-every-sender-before-changing-business-email.\n- Flipboard: a suitable public Zeta-owned magazine now exists: “Zeta Software: Practical Digital Guides”. Reuse it for relevant future topics; do not create duplicates or use the unrelated existing inquiry-form magazine. The Storyboard editor explicitly reported it is unavailable on handheld devices. Normal Flip compose was tried twice for the email DNS sender-map post (the second try only after the first failed and the exact item was absent); both attempts ended with “Failed to flip into Zeta Software: Practical Digital Guides. Please try again later.” The direct website-link preview also returned a Flipboard error. No post was published. In future runs, use normal Flip compose with the existing suitable magazine and exact article URL. If the exact item is absent after a failure, use only the single permitted retry; after a second generic failure, stop, record the failure, and do not keep retrying. Do not claim success without the exact item visible in public flips activity.\n- Pinterest: the email DNS Pin form kept its fields disabled until media was added. One safe in-app-browser upload attempt did not expose a browser file chooser, so the Pin could not be completed. For each future Pin, try the matching project image at most once through a browser file-chooser path; if no safe chooser appears, do not use a native OS picker or repeatedly activate upload. If media is mandatory, record the blocker and skip the Pin rather than submit an empty Pin.\n- Instagram: temporarily paused at the user's direction for this batch; do not attempt access or sign-in during the pause.\n\nINSTAGRAM PAUSE SCOPE CLARIFICATION\nInstagram remains paused in every scheduled run until the user explicitly says verification is complete and asks to resume. Do not open Instagram or attempt sign-in while paused.\n\nPLATFORM RECOVERY PLAYBOOK (user requested 2026-10-15)\nNo workflow can guarantee a 100% publishing success rate. Follow these bounded recovery steps, preserve account/security settings, and report only visible evidence. Keep one post per selected topic per platform. Never create duplicates while diagnosing a missing success signal.\n\nFlipboard\n- Open the supplied profile and inspect recent Flips and the available magazines. Reuse the existing public Zeta Software-owned magazine “Zeta Software: Practical Digital Guides” when it fits the topic. Never use an unrelated magazine or create duplicates.\n- Only if no suitable Zeta-owned public magazine exists, create one from the profile’s Create Magazine flow. The provided form shows an 80-character title counter; keep the title within that displayed limit, use a concise accurate description within the form’s displayed limit, leave Private unchecked for a public magazine, and verify the new magazine appears before using it.\n- Use the regular Flip/compose flow with a clear title, useful summary, and exact verified Zeta article URL. Confirm the selected magazine and content before the single initial submit. If Storyboard reports it is unavailable on the current device, use regular Flip compose once; do not keep switching editors.\n- If an error appears, wait for a terminal result and inspect public Flips activity for the exact title and URL. If visible, stop and record success. If definitely absent, use at most the one permitted retry. After a second generic failure, stop; record the exact error and do not claim a root cause or success.\n\nReddit\n- Start from the supplied submitted-profile page and verify the destination selector says “Submit to u/Complete_Company7401” before drafting. Keep the destination on the user profile; never choose a subreddit.\n- Prepare the title and body once in Text by default, with the exact article URL in the body. An image is optional; a text/link post is still eligible when media cannot be attached.\n- For each post, make at most one safe image-upload attempt total, using one route only: either the Text editor’s image control or Images & Video, whichever visibly exposes a browser-controlled chooser. Do not try both upload routes. Never interact with a native OS file picker; if one unexpectedly appears, press Escape once, verify the composer is restored, and continue without an image. If Images & Video was selected but upload is unavailable, return to Text and confirm the original title and body remain intact before posting.\n- Before the one initial submit, the exact URL may be checked in the Link composer if that can be done without losing the prepared draft. Use Link instead of Text only when the composer visibly displays a matching article image preview and still targets the correct user profile. Otherwise publish the prepared Text version with the URL. Do not submit the same topic in multiple formats or create a second post just to test image rendering.\n- Confirm Post is enabled, activate it once, and wait for a terminal success or error. Verify the exact item in profile activity and capture its permalink. If visible but no separate success signal appears, treat the outcome as unresolved and do not retry. If definitely absent, use only the existing one-time retry rule: focus Post and press Enter once. Never retry a visible or ambiguous item. Record whether the image was uploaded, a matching preview was shown, or omitted.\n\nPinterest\n- Open the supplied profile, confirm the Zeta Software account, and inspect recent Created Pins for the current format and an appropriate Zeta-owned board. Choose an existing relevant board; a website/SEO board is suitable only when it fits the topic. If no suitable board exists and Pinterest requires one, create one relevant public board once and reuse it; do not make duplicates.\n- Start Create Pin and use the matching project image. Make at most one safe browser file-chooser upload attempt. Do not open a native OS picker. If the safe chooser is unavailable, do not repeat the upload control.\n- If the Pin form offers “Save from URL” as a separate visible option, it may be tried once with the exact verified canonical article URL to let Pinterest fetch the article’s own image. Continue only if the resulting media is visibly the matching article image and the destination remains the exact article URL. Do not guess a URL or accept an unrelated image.\n- Once matching media is visible, fill the clear title, useful description, exact article destination URL, and relevant board. Confirm the board and fields before publishing. If media is required and neither safe method provides a visible matching image, leave the Pin unpublished and report that the form requires media; never submit an empty Pin.\n- After the one submit, wait for a terminal result and verify the exact Pin in public activity with its permalink, source URL, and visible image status. Retry only if the exact item is definitely absent, and only once under the general retry rule.\n\nInstagram\n- Instagram is paused until the user explicitly confirms that verification is complete and asks to resume. Do not visit the profile, attempt sign-in, or publish feed posts or Stories while this pause remains active. Report it as temporarily skipped in the required 13-platform table."
