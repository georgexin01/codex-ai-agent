name = "Zeta Software Daily Search Console Report"
prompt = "Run daily at 9:00 AM in Asia/Kuala_Lumpur. Prepare the Google Search Console report for the target property and Sheet named by the user. If the user does not specify a different target, use Search Console property sc-domain:zetasoftware.my and the existing Google Sheet “Google Search Console (ai seo) #performance”: https://docs.google.com/spreadsheets/d/1PZLh9f9foSUU9GZ5QYUdgc2-bnva0y7DX_KnO-zM95I/edit .\n\n1. Check source access first. Confirm the signed-in Search Console report and target Sheet are accessible. Prefer an already authorized data source; otherwise read the visible Search Console report and use its controls. Never request or enter passwords, one-time codes, API keys, or credentials. Do not change access permissions or configure a new cloud project. If either source is inaccessible, stop and report the exact blocker without inventing data.\n\n2. Use complete Search Console daily dates in Pacific Time, not the hourly 24-hour view. GSC data may be delayed 2–3 days. Find the latest full date actually available; if yesterday is missing, use the newest earlier available date. Re-fetch the latest 30 calendar dates ending on that date on every run and upsert by date so revised figures replace earlier ones without duplicates. Keep older history. Never treat an unavailable/pending day as zero.\n\n3. First-run/history backfill. If the target report is empty, newly created, or missing older coverage, perform a one-time backfill for that property and Sheet using the longest history Search Console currently makes available (normally up to 16 months). Record the earliest and latest dates actually available; do not fabricate earlier dates. Backfill every full daily date and month summary in that range. Populate Query, Page, Country, and Device month detail for each historical month when Search Console permits. Preserve existing rows and avoid repeating a full backfill after coverage is complete. Apply this rule again when the user points the schedule at a different property or Sheet.\n\n4. Table structure and no-data design. Preserve source tabs named Daily Summary, Queries, Pages, Countries, Devices, and Monthly Summary. Daily Summary columns: Date (GSC), Clicks, Impressions, CTR, Clicks vs prior day, Impressions vs prior day, Year; no Month column. Show every calendar date in each month covered, in ascending day order; completed months include all days, and the current month stops at the latest available date. Calculate CTR and day changes only when source metrics support them. For periods confirmed by Search Console to have no recorded history (for example, before the property began collecting data), put “-” in metric cells, use a light-gray row with gray text, and add a short “No Search Console data” note where a Notes column exists. Do not use this style for dates that may simply be pending or not yet fetched. Keep Monthly Summary months in YYYY-MM order, all 12 months sorted January–December within each year, with a Year field. Use plain notes such as “In progress,” “Future month,” or “No Search Console data.”\n\n5. Shared filter. Put a “Report Dashboard” tab first in the workbook. Place one Year selector and one Month selector at its top, defaulting to the latest month with data and offering “All.” The same two controls must drive the Dashboard views for Monthly Summary, Daily Summary, Queries, Pages, Countries, and Devices. Keep source tabs intact as historical data tables; explain where the shared selectors are if the user asks. Add new years/months to the selector choices as needed. If the workbook cannot support a shared filter with these views, report that limitation instead of claiming that separate tab filters are shared.\n\n6. Detail tables. Refresh Queries, Pages, Countries, and Devices for the current month through the latest available date. On first-run backfill, add monthly detail for every available month when source permits. Label each row with its exact source month/period and whether it is a month-to-date aggregate or daily breakdown. Preserve older detail rows. Search Console may hide rare/anonymized queries or limit visible rows; label results as available report rows. Do not claim detail-table totals equal property totals.\n\n7. Verify and report. Read every changed tab, filter control, and date range back from the Sheet. Summarize the refreshed period, latest source date, clicks/impressions, important movement, top available queries/pages/countries/devices, what changed, and any data limits/blockers. Search Console clicks are Google Search clicks, not all website visitors. Keep notes and run summaries short and user-readable."
