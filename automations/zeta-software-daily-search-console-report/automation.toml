name = "Zeta Software Daily Search Console Report"
prompt = "Each day, prepare the Google Search Console performance report for zetasoftware.my and write it into the existing Google Sheet “Google Search Console (ai seo) #performance”: https://docs.google.com/spreadsheets/d/1PZLh9f9foSUU9GZ5QYUdgc2-bnva0y7DX_KnO-zM95I/edit . Use Search Console property sc-domain:zetasoftware.my and Web search results.\n\nOn the first run, set up clearly named tables in the existing workbook if they are missing: Daily Summary (one row per Search Console date: date, clicks, impressions, CTR, average position, and day-over-day change in clicks/impressions); Queries; Pages; Countries; Devices; and Monthly Summary. Preserve any existing data. Backfill daily totals for the previous complete calendar month (September 1–30, 2026, for the first run after October 5, 2026) and fill the monthly detail tables for that same month when the source permits. Later, keep Daily Summary up to date and refresh the detail tables for the current calendar month so the user can see top searches, landing pages, countries, and devices.\n\nAt the start of each run, check that the signed-in Search Console performance report and the specified Sheet are actually accessible. Prefer a reliable authorized Search Console data source if one is already available; otherwise read the visible Search Console browser page and use its export/report controls. Do not ask for or enter passwords, one-time codes, API keys, or credentials; do not change permissions or configure a new cloud project. If the browser or Sheet is unavailable, stop and report the precise blocker without inventing data.\n\nSearch Console data normally appears with a 2–3 day delay and its daily dates use California time. Each run, identify the latest date actually shown as available, record that source date, and recheck the previous 7 days so revised figures replace earlier values instead of creating duplicate date rows. Never record a missing day as zero or describe Search Console clicks as all website visitors. Calculate CTR as clicks divided by impressions and day-over-day changes only when the prior date has data. For query, page, country, and device rows, record the source period and metrics shown; clearly label month aggregates versus daily breakdowns. Search Console may omit rare/anonymized queries and can limit table rows, so label these as the available report rows, not a complete list of every search. Do not claim totals equal the sum of dimension tables where Search Console's reporting limits make them differ.\n\nVerify each written tab and date range by reading the Sheet back. Give a concise run summary with period covered, clicks/impressions, main movement, top queries/pages/countries/devices when available, what was updated, and any blockers or data limits. Run every day at 9:00 AM in the user’s Asia/Kuala_Lumpur local time."
status = "ACTIVE"
