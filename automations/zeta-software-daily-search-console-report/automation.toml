name = "Zeta Software Daily Search Console Report"
prompt = "Run every day at 10:46 AM Asia/Kuala_Lumpur. Prepare the Google Search Console report for the property and Google Sheet specified by the user. If none are specified, use sc-domain:zetasoftware.my and “Google Search Console (ai seo) #performance”: https://docs.google.com/spreadsheets/d/1PZLh9f9foSUU9GZ5QYUdgc2-bnva0y7DX_KnO-zM95I/edit\n\nCheck that both Search Console and the Sheet are accessible before writing. Use an already authorized data source when available; otherwise use the signed-in Search Console report. Never request or enter passwords, one-time codes, API keys, or credentials, and do not change permissions or configure a cloud project. If either source is inaccessible, stop and report the exact blocker without inventing data.\n\nUse complete Search Console daily dates in Pacific Time, not an hourly 24-hour view. Data may be delayed 2–3 days: find the latest full date actually available, re-fetch the latest 30 calendar dates ending there (at least 28 days), and upsert by date so revised metrics replace old values. Never record a missing or pending day as zero. Keep older history on Daily Summary and detail tabs; never delete historical report data.\n\nFor a new, empty, or incomplete report, perform a one-time historical backfill covering the longest period available, up to a maximum lookback of 24 months. Search Console may retain less history (currently up to 16 months); use the actual source limit, record the exact date coverage and retention boundary, and do not claim to have checked dates outside it. Include available daily totals and monthly Queries, Pages, and Countries details where the source permits. Check each month within the verified source period against the property-wide performance report. Do not create Monthly Summary rows for months with no reportable Search Console activity or for future months. Record checked no-data month ranges in a note on Monthly Summary cell A1 so future runs do not repeat those searches; do not add visible columns or rows for this tracking. Use “No Search Console data” in that note only after confirming no reportable impressions/clicks; leave unverified ranges marked pending in the note. Treat months outside the source retention window as outside history, not as no data. Do not repeat completed historical checks. Run another full backfill only if the user selects a different property or Sheet or asks for one. Preserve all actual existing figures unless replacing them with verified corrected source data.\n\nMaintain only these tabs: Daily Summary, Monthly Summary, Queries, Pages, and Countries. Do not create a Report Dashboard or a Devices tab. Do not change existing columns, saved filters/group views, or table appearance. Daily Summary columns are Date (GSC), Clicks, Impressions, CTR, Clicks vs prior day, Impressions vs prior day, Month, Year. Keep Month immediately before Year with full month names (January–December), and dates ascending within each month. Include every calendar day in completed months. For the current month, include dates only through the latest full date actually available in Search Console; do not pre-create rows for later dates. For dates confirmed to have no recorded Search Console activity, show “-” in metric cells with gray text/fill; do not apply this style to pending dates. Calculate CTR and daily changes only when supported by source data.\n\nMonthly Summary uses the existing columns and Year filter/group views, but contains only months with verified Search Console activity (clicks or impressions), plus the current month even if its figures are still partial or unavailable. Do not create placeholder rows for past no-data months, unverified historical months, future months, or future years. If a historical backfill later discovers real data for an omitted month, add that month with its metrics. Keep actual data months in YYYY-MM format and chronological order. Keep the existing Year-based Group by view selector and 2025, 2026, and 2027 choices; preserve the current-year view as default and add views when years with actual data require them. Keep the existing notes, table filters, layout, and appearance. Use the Monthly Summary A1 cell note to track which historical ranges were checked and their outcome.\n\nRefresh Queries, Pages, and Countries for the current month through the latest available Search Console date on routine runs. During the one-time backfill, collect monthly details for historical months where the source permits. Label each row with Source month (YYYY-MM) and preserve month-to-date aggregate semantics for routine updates. Preserve older detail rows. Search Console may omit anonymized/rare queries and limit available rows; describe these as available report rows. Dimension totals need not equal property totals.\n\nKeep existing saved month-year views and defaults on Daily Summary, Queries, Pages, and Countries, with the newest month that has data active by default. Include views for months as data arrives, using the existing Month and Year columns on Daily Summary and Source month on detail tabs. Keep the current table view and sheet structure intact.\n\nRead every changed tab and date range back from the Sheet. Summarize the refreshed period, latest available source date, clicks/impressions and movement, top available queries/pages/countries, what changed, and source/retention limits. Put freshness information in the concise run summary; do not add a freshness column or make tables visually busier. Search Console clicks are Google Search clicks, not all website visitors. Keep notes and summaries concise."
status = "ACTIVE"
