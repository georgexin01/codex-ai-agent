name = "Zeta Software Daily Search Console Report"
prompt = "Run every day at 10:46 AM Asia/Kuala_Lumpur. Prepare the Google Search Console report for the property and Google Sheet specified by the user. If none are specified, use sc-domain:zetasoftware.my and “Google Search Console (ai seo) #performance”: https://docs.google.com/spreadsheets/d/1PZLh9f9foSUU9GZ5QYUdgc2-bnva0y7DX_KnO-zM95I/edit\n\nCheck that both Search Console and the Sheet are accessible before writing. Use an already authorized data source when available; otherwise use the signed-in Search Console report. Never request or enter passwords, one-time codes, API keys, or credentials, and do not change permissions or configure a cloud project. If either source is inaccessible, stop and report the exact blocker without inventing data.\n\nUse complete Search Console daily dates in Pacific Time, not an hourly 24-hour view. Data may be delayed 2–3 days: find the latest full date actually available, re-fetch the latest 30 calendar dates ending there on each run, and upsert by date so revised metrics replace old values. Never record a missing or pending day as zero.\n\nFor a new, empty, or incomplete report, perform a one-time backfill of the longest history Search Console makes available (normally up to 16 months), including daily totals and month summaries; add monthly Queries, Pages, and Countries details when available. Record the actual date range and preserve existing data. Do not repeat the full backfill after coverage is complete. Apply it again if the user points this schedule to a different property or Sheet.\n\nMaintain only these tabs: Daily Summary, Monthly Summary, Queries, Pages, and Countries. Do not create a Report Dashboard or a Devices tab. Daily Summary columns: Date (GSC), Clicks, Impressions, CTR, Clicks vs prior day, Impressions vs prior day, Month, Year. Put Month immediately before Year, with full month names (January–December). Keep all dates in ascending order within each month. Include every calendar day in completed months. For the current month, include dates only through the latest full date actually available in Search Console; do not pre-create rows for later dates. For periods confirmed to have no recorded history, show “-” in metric cells with gray text/fill and a short “No Search Console data” note where a Notes column exists. Do not style pending dates this way. Calculate CTR and daily changes only when supported by source data.\n\nKeep Monthly Summary months as YYYY-MM, with a Year column and all 12 months in calendar order. Always include all twelve months for every year with actual report history, plus the rolling prior year, current year, and next year, even if those extra years have no data. For example, in 2026 include 2025, 2026, and 2027. Add any missing month rows in January-to-December order. Leave unsupported metrics blank; mark a year/month “No Search Console data” with gray text/fill and “-” only after checking that the source has no history for it. Use “History check pending” while an older year has not yet been checked, and “Future month” for future dates.\n\nIn Monthly Summary, maintain a Year-based Group by view selector from the table menu, with a selectable view for each year that has data plus the rolling prior, current, and next years. For example, in 2026 the selector must include 2025, 2026, and 2027. Each year view must show all twelve months in January-to-December order for that year. Keep the current-year view active by default. Preserve the existing year views and create any missing year view when adding a year; do not replace the grouped-year selector with only a Year-column basic filter. Preserve any Year column filter only if it does not hide rows needed by the selected grouped-year view.\n\nRefresh Queries, Pages, and Countries for the current month through the latest available Search Console date. Label each row with its exact Source month (YYYY-MM) and retain month-to-date aggregate semantics. Preserve older detail rows. Search Console may omit anonymized/rare queries and limit available rows; describe these as available report rows. Dimension totals need not equal property totals.\n\nKeep each tab focused on the right time range: filter Daily Summary to the newest month with data, using its Month and Year columns; show the current year in Monthly Summary's grouped-Year view; filter Queries, Pages, and Countries by the newest Source month (YYYY-MM). Expand each native table and saved view to include newly added rows before filtering. The visible column dropdowns let users choose other months/years; filters are per tab, not shared. Update defaults to the newest period with data on every run.\n\nMaintain saved table views on Daily Summary, Queries, Pages, and Countries for every year-month that has actual data in the workbook. Name each view with the month and year, for example “September 2026” or “October 2026.” Filter Daily Summary views using both Month and Year; filter detail-tab views using Source month (YYYY-MM). On each run, check the existing table-backed views and create any missing month-year views without duplicates as data is backfilled or new months arrive. Keep the active/default filter on those four tabs set to the newest month with data. Do not create month-year views for Monthly Summary; maintain the Year-based Group by view selector described above. Reuse the existing Month, Year, and Source month columns; add a helper column only if the source structure truly lacks a usable month/year field.\n\nRead every changed tab and date range back from the Sheet. Summarize the refreshed period, latest available source date, clicks/impressions and movement, top available queries/pages/countries, what changed, and any data limits. Search Console clicks are Google Search clicks, not all website visitors. Keep notes and summaries concise."
