name = "Zeta Software Daily Search Console Report"
prompt = "Run daily at 9:00 AM in Asia/Kuala_Lumpur. Prepare a Google Search Console performance report for zetasoftware.my and update the existing Google Sheet “Google Search Console (ai seo) #performance” at https://docs.google.com/spreadsheets/d/1PZLh9f9foSUU9GZ5QYUdgc2-bnva0y7DX_KnO-zM95I/edit . Use the Search Console property sc-domain:zetasoftware.my and Web search results.\n\n1. Check access first. Confirm the signed-in Search Console report and target Sheet are both accessible. Prefer a reliable authorized Search Console source already connected; otherwise use the visible report and its export controls. Never ask for or enter passwords, one-time codes, API keys, or credentials. Do not change permissions or configure a new cloud project. If either source is inaccessible, stop and report the blocker without inventing data.\n\n2. Choose the correct dates. Use Search Console DAILY dates, which are complete calendar days in Pacific Time (00:00:00–23:59:59 PT). Do not treat the 24-hour/hourly view as a completed day. Search Console data may take 2–3 days to appear. Find the latest full date actually available; if yesterday is absent, use the newest earlier available date. Never turn a missing date into zero.\n\n3. Correct recent history. Each run, re-fetch the most recent 30 calendar dates ending on the latest available date. Upsert rows by date so revised clicks/impressions replace old figures without duplicates. Keep older history. Recheck at least the previous 7 days within that window. The Daily Summary must show every calendar date for each month it contains, in day 01-to-last-day order. For completed months, include the whole month; for the current month, include dates through the latest available date only. Add blank metric rows for dates with no Search Console row; leave future dates out. Daily Summary columns are Date (GSC), Clicks, Impressions, CTR, Clicks vs prior day, Impressions vs prior day, and Year. Do not add a Month column. Calculate CTR as clicks/impressions and day changes only if both dates have data. Average position can be included only when the source shows it. Clearly identify dates as Search Console Pacific-time dates. Clicks are Google Search clicks, not all website visitors.\n\n4. Keep the workbook easy to browse. Preserve existing data and these tables: Daily Summary, Queries, Pages, Countries, Devices, Monthly Summary. Daily Summary date rows are ascending within each month and have a Year filter column. Monthly Summary has Month in YYYY-MM and Year columns, with all 12 months per year always ordered January through December. Put real metrics only where that month's data is reported; leave unreported metrics blank, using short plain-language notes such as “Not recorded,” “In progress,” or “Future month.” Add rows for each new year as needed.\n\n5. Refresh detail tabs. Refresh Queries, Pages, Countries, and Devices for the current month through the latest available Search Console date. Label rows with exact source period and whether figures are month-to-date aggregates or daily breakdowns. Preserve older monthly detail if present. Show only query rows Search Console makes available; some searches are hidden for privacy and tables may have row limits. Do not claim dimension-table totals must equal property totals.\n\n6. Verify and report. Read every changed tab and date range back from the Sheet. Summarize the date window refreshed, latest available source date, clicks/impressions and notable movement, top available queries/pages/countries/devices, what changed, and blockers or reporting limits. Keep sheet notes and the run summary concise and easy to understand."
status = "ACTIVE"
rrule = "RRULE:FREQ=WEEKLY;BYHOUR=10;BYMINUTE=45;BYDAY=SU,MO,TU,WE,TH,FR,SA"
