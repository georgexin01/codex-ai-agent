name = "Zeta Software Daily Search Console Report"
prompt = "Run every day at 9:00 AM Asia/Kuala_Lumpur. Prepare the Google Search Console report for the property and Google Sheet specified by the user. If none are specified, use sc-domain:zetasoftware.my and “Google Search Console (ai seo) #performance”: https://docs.google.com/spreadsheets/d/1PZLh9f9foSUU9GZ5QYUdgc2-bnva0y7DX_KnO-zM95I/edit\n\nCheck that both Search Console and the Sheet are accessible before writing. Use an already authorized data source when available; otherwise use the signed-in Search Console report. Never request or enter passwords, one-time codes, API keys, or credentials, and do not change permissions or configure a cloud project. If either source is inaccessible, stop and report the exact blocker without inventing data.\n\nUse complete Search Console daily dates in Pacific Time, not an hourly 24-hour view. Data may be delayed 2–3 days: find the latest full date actually available, re-fetch the latest 30 calendar dates ending there on each run, and upsert by date so revised metrics replace old values. Never record a missing or pending day as zero.\n\nFor a new, empty, or incomplete report, perform a one-time backfill of the longest history Search Console makes available (normally up to 16 months), including daily totals and month summaries; add monthly Queries, Pages, and Countries details when available. Record the actual date range and preserve existing data. Do not repeat the full backfill after coverage is complete. Apply it again if the user points this schedule to a different property or Sheet.\n\nMaintain only these tabs: Daily Summary, Monthly Summary, Queries, Pages, and Countries. Do not create a Report Dashboard or a Devices tab. Daily Summary columns: Date (GSC), Clicks, Impressions, CTR, Clicks vs prior day, Impressions vs prior day, Month, Year. Put Month immediately before Year, with full month names (January–December). Keep all dates in ascending order within each month. Include every day in a completed month and dates only through the latest available date in the current month. For periods confirmed to have no recorded history, show “-” in metric cells with gray text/fill and a short “No Search Console data” note where a Notes column exists. Do not style pending dates this way. Calculate CTR and daily changes only when supported by source data.\n\nKeep Monthly Summary months as YYYY-MM, with a Year column and all 12 months in calendar order. Show metrics only when reported; otherwise use short notes such as “No Search Console data,” “In progress,” or “Future month.”\n\nRefresh Queries, Pages, and Countries for the current month through the latest available Search Console date. Label each row with its exact Source month (YYYY-MM) and retain month-to-date aggregate semantics. Preserve older detail rows. Search Console may omit anonymized/rare queries and limit available rows; describe these as available report rows. Dimension totals need not equal property totals.\n\nKeep each tab focused on the right time range: filter Daily Summary to the newest month with data, using its Month and Year columns; filter Monthly Summary by the newest year so it shows all 12 months January–December; filter Queries, Pages, and Countries by the newest Source month (YYYY-MM). Expand each native table to include newly added rows before filtering. The visible column dropdowns let users choose other months/years; filters are per tab, not shared. Update defaults to the newest period on every run.\n\nRead every changed tab and date range back from the Sheet. Summarize the refreshed period, latest available source date, clicks/impressions and movement, top available queries/pages/countries, what changed, and any data limits. Search Console clicks are Google Search clicks, not all website visitors. Keep notes and summaries concise."
status = "ACTIVE"
