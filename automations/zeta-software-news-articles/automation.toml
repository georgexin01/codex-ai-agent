prompt = "Before researching topics or creating article titles, news/blog articles, article metaTitle or metaDescription, or summaries of researched information in each run, read and follow C:\\Users\\user\\.codex\\skills\\articles-research-way\\SKILL.md. Apply its research, sourcing, and topic-demand checks alongside the project workflow below. If the skill file cannot be read, do not draft content; report the blocker.\n\nWork in D:\\backup\\website-zetasoftware. Each daily run produces four new bilingual articles for the current date.\n\nBefore writing, read the relevant root Markdown files: blogs.md, status.md, README.md, meta.md, project-maintenance.md, and website-content-knowledge-cn.md. Review the English and Chinese homepages, both article indexes, current article data, existing titles/slugs, the latest detail pages, and the article/image/page-generation scripts. Use the active website and these files as the source of truth.\n\nUse the configured .codex route to identify relevant content or image skills when available. Follow the project article workflow in blogs.md and the built-in imagegen skill for new artwork. If a dedicated article-writing skill or the canonical router is unavailable, proceed from blogs.md and report that limitation; do not scan the full skills tree.\n\nResearch ten timely topic candidates related to Zeta Software's actual services and Johor/Malaysian businesses. Browse current sources, preferring official agencies and primary material; record source URLs and publication/update dates. Treat these as editorial candidates, not a popularity ranking, unless current search-trend evidence supports that claim. Select four distinct, useful topics and avoid duplicates.\n\nThe site calls these pages Blogs and uses /blogs/ and /cn/blogs/. Do not create /news/ routes. Add four English records and natural Simplified Chinese counterparts using the next unused IDs. Keep IDs, slugs, dates, and image paths paired. Make the dated batch writer safe to rerun without duplicates. Write at least 300 English words per article; answer the question in the opening 40–80 words and include practical steps, trade-offs, a clearly illustrative example, a checklist, and a next action. Localize the Chinese article fully and retain the same evidence and limits. Preserve the project's contentHtml paragraph-only contract and established fields, with article-specific description, metaTitle, and metaDescription. Keep direct source links in the batch script and dated topic notes.\n\nGenerate one distinct editorial image per article with the built-in image generator. Use realistic Malaysian business scenes without logos, watermarks, fake readable interface text, invented signage, or private data. Check that each generated source image exists and matches its image manifest entry before conversion. Save final .jpg covers under images/blog/, no larger than 900×900 pixels and strictly below 200,000 bytes.\n\nRun the dated batch writer, image preparation, image validation, and scripts/generate-blog-pages.js. Confirm both homepages select the newest three records; the Chinese feed must merge data/blogs-cn.json and data/blogs-cn-additional.json. Update status.md and synchronize the current totals and research sources in README.md, meta.md, project-maintenance.md, blogs.md, and website-content-knowledge-cn.md.\n\nRun the dated verifier and syntax checks. Check bilingual parity, article length, unique slugs and images, dimensions and byte limits, paragraph-only content, metadata, newest-first sorting, eight detail routes, and unique sitemap URLs. Verify both homepages, both article indexes, and all eight new routes over local HTTP. Reuse a healthy server or start one at 127.0.0.1:8080 if needed. Do not deploy or claim production indexing.\n\nReport the four titles, image files and sizes, source links, files changed, route checks, and any external work left unverified. Keep this automation's existing daily schedule and ACTIVE status. Omit first-run study instructions from future runs."
