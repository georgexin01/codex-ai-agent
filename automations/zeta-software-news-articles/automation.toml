prompt = "Before writing any topic, article title, description, summary, or SEO metadata, read and follow C:\\Users\\user\\.codex\\skills\\articles-research-way\\SKILL.md. Resolve writing and image guidance through the configured .codex skill router; follow blogs.md and the built-in imagegen skill. If a required skill cannot be read, do not draft and report the blocker. Do not scan the full skills tree.\n\nWork in D:\\backup\\website-zetasoftware. Produce four new bilingual blog pairs dated for the current local day. The site uses /blogs/ and /cn/blogs/; do not create /news/ routes.\n\nBefore changing files, read blogs.md, status.md, README.md, meta.md, project-maintenance.md, website-content-knowledge-cn.md, both homepages and blog indexes, both Chinese datasets plus the English dataset, existing titles/slugs, the newest detail pages, and the relevant writer, image, homepage-feed, validation, and generation scripts. Use current project files as truth. Check recent article batches and all existing titles/slugs so today's four subjects do not duplicate them.\n\nResearch ten timely candidates connected to Zeta's actual services and Malaysian/Johor business readers. Browse and open primary or authoritative sources; do not rely on snippets alone. Record source URL, publisher, publication/update date (or state that the official page does not show one), geography, and exactly what each source supports. If a source cannot be opened or its key terms cannot be checked, use another opened source or disclose the evidence gap and avoid attributing unsupported requirements. Treat candidates as an editorial shortlist, not a popularity ranking, unless comparable current search-demand data supports a ranking. Check current Search Console, analytics, Google Trends, or Keyword Planner only when accessible; report the dataset and scope, and never invent demand/volume. Prefer reader fit, timeliness, evidence, originality, and answerability. Keep direct source links in both the dated research note and batch writer.\n\nSelect four distinct topics. Write at least 300 English words per article with a direct answer in the first 40–80 words, practical steps, trade-offs, a clearly illustrative—not real-client—example, a checklist, and a next action. Fully localize each Chinese counterpart and preserve the same evidence limits. Keep the existing fields and paragraph-only contentHtml contract; use article-specific description, metaTitle, and metaDescription. For legal, tax, payment, privacy, or security claims, state jurisdiction and applicability limits and use current official sources; do not give unsupported individualized conclusions. Never invent customer stories, prices, credentials, outcomes, quotes, or company capabilities.\n\nAdd a dated batch writer that validates the next unused IDs and complete EN/CN pairing before writing. It must safely rerun without duplicate IDs or slugs, and a partial or conflicting pair must stop before writes. Generate one distinct editorial image per article with the built-in image generator. Use realistic Malaysian business scenes without logos, watermarks, fake readable interfaces, invented signage, or private data. Inspect each generated file visually and match it to the article by its content; do not infer image-to-prompt mapping from file order. Confirm every source image exists and matches its manifest entry before conversion. Save final .jpg covers under images/blog/, no larger than 900×900 and strictly below 200,000 bytes.\n\nRun the dated writer, image preparation, image validator, and scripts/generate-blog-pages.js. The Chinese homepage must merge data/blogs-cn.json and data/blogs-cn-additional.json before sorting; both homepages should show the newest three records. Update status.md and synchronize the current totals and research sources in README.md, meta.md, project-maintenance.md, blogs.md, and website-content-knowledge-cn.md.\n\nRun the dated verifier and syntax checks. Verify bilingual parity, article length, unique slugs and images, dimensions and byte limits, paragraph-only content, metadata, newest-first sorting, eight detail routes, and unique sitemap URLs. When asserting generated HTML metadata, use the same escaping behavior as scripts/generate-blog-pages.js so characters such as apostrophes do not create false failures. Verify both homepages, both article indexes, and all eight new routes over local HTTP. Reuse a healthy server or start one at 127.0.0.1:8080 if needed. Check the dated writer can be rerun without duplicates. Do not deploy or claim production indexing.\n\nReport the four titles, image files and sizes, source links, files changed, route checks, verifier and HTTP results, demand-data limitations, and external work left unverified. Preserve this automation's existing daily schedule and ACTIVE status, and preserve its target thread. Keep future prompts free of first-run study notes."
