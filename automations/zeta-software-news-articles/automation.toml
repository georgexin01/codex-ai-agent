name = "Zeta Software News Articles"
prompt = "Before drafting any topic, title, article, summary, or SEO metadata, read and follow C:\\Users\\user\\.codex\\skills\\articles-research-way\\SKILL.md. Resolve writing/image guidance through the configured .codex skill router; follow blogs.md and the built-in imagegen skill. If a required skill cannot be read, do not draft; report the blocker. Do not scan the full skills tree.\n\nPURPOSE AND ROUTES\nA publication date does not need to be supplied by the requester. Use the current local date for each new article. Every scheduled or explicitly requested invocation runs a fresh four-topic batch, even if another batch was published earlier on the same local date; do not skip solely because today's batch exists. Select four new reader intents and unique slugs/images, and preserve the complete-batch no-op behavior only when rerunning that same invocation's exact records.\nWork in D:\\backup\\website-zetasoftware. Publish four new bilingual EN/CN blog pairs dated for the current local day. This site calls them Blogs and uses /blogs/ and /cn/blogs/; never create /news/ routes.\n\nPROJECT REVIEW BEFORE EDITING\nRead blogs.md, status.md, README.md, meta.md, project-maintenance.md, website-content-knowledge-cn.md, both Zeta homepages and blog indexes, data/blogs.json, data/blogs-cn.json, data/blogs-cn-additional.json, all existing Zeta titles/slugs, recent batches, newest detail pages, and relevant writer, image, homepage-feed, validation, and page-generation scripts. Also read D:\\backup\\zeta-aiseo\\NEWS_WORKFLOW.md, NEWS_STATUS.md, PROJECT_CONTEXT.md, README.md, NEWS_RESEARCH_TEMPLATE.md, data/news.json, its current homepage/list/detail examples, and tools/generate-news.js plus tools/validate-news.js. Use current files from both projects as truth. Compare candidate reader questions and slugs against both archives before selecting topics; reject duplicates or near-duplicates on either site.\n\nEvery selected daily topic must be publishable in both projects. Choose four distinct, evidence-backed questions that serve Zeta's software/business readers and Aiseo's Johor/Malaysia small-business audience. Treat Aiseo's editorial scope as including relevant business software, digital workflows, selection, implementation, integration, and platform/policy changes alongside AI/search. Do not choose four Zeta topics and decide afterward that they do not belong on Aiseo.\nTOPIC DISCOVERY: MARKET SEARCHES + REAL READER NEEDS\nUse the read-only Keyword Planner sheet when accessible: https://docs.google.com/spreadsheets/d/16Seh_m7gplqsp8z5E7ZFUl17G-m66IFpLvtaPqtx9MI/edit?gid=2048567051#gid=2048567051 (tab: zetasoftware.my). Do not edit the sheet. Also check current Search Console, site analytics, Google Trends, customer questions, and sales/support questions only where the data is accessible and authorized. For every dataset, record its date, platform, geography, language, time range, and metric scope. Do not imply unavailable tools/data were checked.\n\nFind a broad set of current search topics that match Zeta Software's verified services and Malaysian/Johor business readers. Explore real phrases and questions in English, Simplified Chinese, and Malay where available; distinguish language and geography instead of translating one keyword set and treating it as equivalent demand. Consider relevant service and problem clusters such as custom websites/apps, CRM, ERP, WMS, inventory, POS, MRP, HR, and workflow automation only where supported by project evidence. Look for the exact decision, task, or pain behind a phrase: selection, comparison, implementation, integration, cost factors, migration, security, maintenance, or a current local change. Treat Keyword Planner search ranges as estimates; its ad competition and bid metrics are not organic ranking difficulty or proof of buyers. Google Trends is relative interest, not search volume or readership. Search suggestions and communities are qualitative discovery, not complete or ranked demand datasets.\n\nResearch ten distinct candidate topics, not ten minor keyword variations. For each, record: the intended Malaysian/Johor reader; the specific question to answer; the English/Chinese/Malay query or intent cluster when supported; source and dataset links; publisher/tool and checked date; publication/update date and geography; what the evidence supports; recency; fit with Zeta's verified services; how it differs from existing articles; and evidence gaps. Open primary or authoritative sources and read the relevant material, not search snippets alone. Prefer regulators, government agencies, official product documentation, original data, and strong independent reporting where needed. Never state that a topic is “top,” “most searched,” “trending,” or popular unless comparable current data supports that exact claim. Present the ten as an editorial shortlist when no comparable ranking exists.\n\nSelect four genuinely distinct, useful topics by reader need, business fit, evidence quality, freshness, originality, and answerability—not search volume alone. Prefer a mix of high-intent software/service questions and timely local business issues where the evidence justifies them; do not force a trend or a service pitch. Use one article per distinct reader intent. If search-demand datasets are unavailable, use verified user questions, source-backed current issues, and project evidence; clearly report that limitation. Do not invent demand or fill slots with thin variants.\n\nTITLE, SUMMARY, AND META QUALITY\nWrite modern, clear, natural titles for the actual question, in the audience's language. Make the promise concrete: state who the article helps and what decision, task, or outcome it clarifies. Use a current search phrase naturally when relevant, but avoid keyword stuffing, vague trend bait, exaggerated urgency, generic “ultimate guide” phrasing, unsupported superlatives, clickbait, and title templates repeated across the batch. Include Malaysia/Johor only when it materially improves scope or accuracy. Keep titles distinct from all existing English and Chinese titles.\n\nCreate article-specific short descriptions/excerpts and metaTitle/metaDescription that accurately match the body and intended query. The description should quickly explain the problem, useful answer, and any important scope limit; it must not merely repeat the title or use generic promotion. Meta titles should be readable and specific; meta descriptions should be concise, compelling, and factual without promises of rankings, sales, savings, eligibility, or outcomes. Fully localize Chinese title, excerpt, description, metaTitle, metaDescription, and article body into natural Simplified Chinese using locally appropriate search wording; do not produce a literal English translation. Keep the same facts, evidence, caveats, and jurisdiction scope in both languages.\n\nARTICLE CONTENT\nWrite at least 300 English words per article, but do not pad to reach a count. Answer the reader's central question directly in the first 40–80 words. Then give useful reasoning and practical steps, trade-offs/limitations, a clearly labeled illustrative hypothetical example (never imply a real client), a practical checklist, and a next action. Add information beyond a summary of other pages through careful synthesis, local context, or a useful decision method. Keep claims and links close to the evidence they support. Preserve the project's fields and paragraph-only contentHtml contract. Use current official sources for legal, tax, payment, privacy, or security claims; state jurisdiction/applicability and avoid individualized advice. Never invent client stories, prices, credentials, quotations, results, reviews, company capabilities, or service areas.\n\nFor every source, record direct URL, publisher, publication/update date (or explicitly say the official page shows no date), geography, and the precise claim it supports. Distinguish confirmed facts, attributed statements, interpretation, and unknowns. If important wording, eligibility, dates, or source terms cannot be checked, replace the source or disclose the gap and do not make the unsupported claim. Keep links in the dated research note and batch writer.\n\nIMAGES\nGenerate one distinct editorial image per article with the built-in image generator. First inspect the actual blog-card and detail-image boxes, responsive crop behavior, and relevant CSS at desktop/mobile sizes, following the image-generation asset policy. Record the target selectors, rendered dimensions/aspect ratio, crop rule, and safe composition. Images should communicate each article's actual subject and reader need in a modern editorial style, with realistic Malaysian business context when suitable.\n\nVary the four-cover set. At least 30% of covers that show a mobile, laptop, tablet, or computer must show a screen from a natural front-facing or three-quarter camera angle, with topic-specific content readable at measured crops. Reach this readability through believable over-shoulder or side-of-user composition, natural hand placement, realistic device proportions, and an ergonomic screen angle. Never rotate a device or paper unnaturally toward the camera, pose a person pointing at the screen, or make the user's gaze/hand position conflict with the device orientation just to expose content. If a screen cannot be both plausible and sufficiently legible, choose a natural screenless editorial scene for that topic. Do not default device scenes to the back: use a useful screen view where it fits the real activity. Across each four-cover batch, include at least two natural, readable front/three-quarter screen covers when the topics reasonably support them. Do not force a device into an unrelated topic. Make each featured screen large, sharp, and angled so its content is identifiable at the measured card/detail sizes and survives the actual crop. Show coherent, topic-specific website or app content, such as an invoice summary, product list, stock view, workflow screen, contact form, or relevant dashboard. Use a few concise, legible labels and neutral illustrative values. A screen must not show only an unknown icon, loading spinner, blank surface, or generic unidentified site. When a screen is useful, make it resemble a professionally designed, complete product page rather than a few isolated topic labels in cards: use coherent information hierarchy, consistent spacing/alignment and restrained colors. For a desktop site/dashboard, include a plausible navigation or top bar, page heading, substantial task area such as a table/product grid/records list/workflow, useful search/filter/action controls and relevant status details. For a phone, design a mobile-first app with compact navigation, readable task content, suitable actions and bottom/segmented navigation; never shrink a desktop dashboard onto a phone. Keep a few larger topic-specific labels legible in the real crops instead of cluttering the screen with tiny text. The uploaded site screenshots are layout-quality references only; do not copy their brand, wording, site, or composition.\n\nKeep screen interfaces clearly illustrative: do not imitate a specific company product, government portal, or official app; do not invent policy wording, analytics, outcomes, testimonials, or company capabilities. No logos, watermarks, invented signage, real customer records, private data, or dense blocks of tiny text. If an image includes a screen but its content is blank, garbled, pseudo-readable, misleading, too small, or unrelated to the article, reject it and regenerate with a targeted prompt change. If a screen cannot be generated with meaningful content, do not use that image; try a different composition without a visible screen only if the article remains clear and the image passes the same quality gate.\n\nRate every generated output, including rejected attempts, on a 10-point scale for: (1) topic and reader relevance, (2) scene/content clarity and screen realism when present, (3) crop-safe composition at the actual card/detail sizes, and (4) visual quality and professional suitability. Record each score, overall score, decision, and rejection/regeneration reason in the dated image manifest. Accept an image only with an overall score of at least 8/10, no individual category below 7/10, and—when a screen is shown—screen-content clarity of at least 8/10. Any confusing topic match, malformed screen content, brand/logo, watermark, private data, or important subject lost to cropping is an automatic rejection regardless of average score. Visually inspect each source and final JPG at the actual rendered sizes; do not infer which output belongs to which prompt from file order.\n\nIMAGE APPROVAL GATE BEFORE DATA WRITES\nAfter topic selection, generate, inspect, and rate all four covers before writing article records to the blog JSON files, running the dated batch writer, or generating/updating article pages. Regenerate failed covers with targeted changes, up to three retries per rejected concept. Proceed to the writer and page-generation steps only after all four covers pass. If any concept still fails, stop before blog-data/page writes and report the image blocker; do not publish a partial batch. For approved covers, verify each generated source exists and matches its manifest path, hash, and dimensions before conversion. Save opaque JPGs under images/blog/, using dimensions appropriate to the measured target and no larger than 900×900; each final file must be strictly below 200,000 bytes. Check final quality and record final dimensions and byte size.\n\nSAFE WRITER AND PAGE GENERATION\nAdd a dated batch writer that validates next-unused IDs, unique slugs/image paths, and complete EN/CN pairing before writing. It must be safe to rerun without duplicates; any partial or conflicting pair must stop before writes. Run the dated writer, image preparation, image validator, and scripts/generate-blog-pages.js. Ensure the Chinese homepage merges data/blogs-cn.json and data/blogs-cn-additional.json before sorting, and both homepages show the newest three records. Update status.md and synchronize current totals, dated research sources, routes, and verification notes in README.md, meta.md, project-maintenance.md, blogs.md, and website-content-knowledge-cn.md.\n\nVERIFICATION\nRun the dated verifier and syntax checks. Verify bilingual ID/date/slug/image parity; unique IDs, slugs, and today's images; minimum English word count; Chinese localization and equivalent evidence/caveats; paragraph-only content; article-specific descriptions and metadata; explicit checklist and next action; newest-first indexes and homepage selection; eight detail routes; image dimensions/format/byte limits; and unique sitemap URLs. For generated HTML metadata, use the same escaping as scripts/generate-blog-pages.js. Verify both homepages, both blog indexes, and all eight new detail routes over local HTTP, reusing a healthy server or starting one at 127.0.0.1:8080. Confirm rerunning the dated writer adds no duplicates. Do not deploy or claim production rendering, indexing, ranking, or search performance.\n\nHANDOFF\nReport the four bilingual titles, target reader and question for each, why each topic was selected, dataset/source scope and limits, cover paths/dimensions/byte sizes, changed files, verifier and HTTP results, and anything external that remains unverified. State clearly if Search Console, analytics, Trends, or Keyword Planner data was inaccessible. Preserve this automation's existing daily schedule, ACTIVE status, and target thread. Keep future prompts free of first-run study notes.\nSECOND PROJECT: REQUIRED AISEO MIRROR\nFor every one of today's four published Zeta bilingual blog pairs, also create one corresponding Simplified-Chinese Aiseo news article in D:\\backup\\zeta-aiseo. This is required for all four topics, not an optional subset. Each Aiseo page must answer the same reader question and preserve the matching Zeta pair's checked facts, sources, dates, caveats, practical advice, and next action. Reuse the matching Chinese Zeta title, description/excerpt, metaTitle, and metaDescription wherever the Aiseo fields align; do not invent a different promise. Localize wording naturally for Aiseo, and restructure the Chinese body only as needed for its page schema while retaining the same information and limits.\n\nBefore drafting, inspect Aiseo's current articles, titles, and slugs and deduplicate candidate intent against both projects. Follow its complete data/news.json contract: stable ASCII slug, category, current publication date, Chinese title/summary/meta, coverLabel, coverType (1-9), accurate alt, lead, at least three substantive headed sections with source-reference IDs, reader note, direct dated source records with precise supports, and three valid related published slugs. Preserve the no-byline and published/draft rules. Keep the same source URLs and evidence notes in the dated research records for both projects.\n\nUse the same approved generated image for each matching Zeta/Aiseo topic. During CSS/crop review and image approval, ensure the composition serves both projects' card/detail crops. Copy the selected artwork locally to Aiseo at images/news/{slug}.jpg and create its compliant rendition from the same source image: JPG, no more than 900x600 px, strictly below 200,000 bytes. Do not generate another image for the mirror. Record the source-to-cover mapping and size/hash details. Inspect the final Aiseo crop and confirm it still clearly matches the topic.\n\nBefore any JSON write, preflight the full batch in both projects: four complete EN/CN pairs, four matching Aiseo records, unique IDs/slugs/images, all sources and related links, and all eight required covers. The dated writer must be safe to rerun and stop before writes on a partial or conflicting cross-project batch; exact existing records are a no-op. Then run scripts/generate-blog-pages.js for Zeta and node tools/generate-news.js plus node tools/validate-news.js for Aiseo. Verify both Zeta homepages/indexes and all eight Zeta detail routes, plus Aiseo homepage, /news/, all four new detail routes, four local JPG covers, /robots.txt, and /sitemap.xml over local HTTP. Confirm newest-first feeds, related links, metadata/schema/source references, and unique sitemap URLs. Update both projects' status/research/handoff files. Do not deploy or claim production rendering, indexing, ranking, or search performance. Report each Zeta bilingual pair beside its matching Aiseo page, with the shared title/topic/source/image mapping and both projects' local verification."
