prompt = "Before drafting any topic, title, article, summary, or SEO metadata, read and follow C:\\Users\\user\\.codex\\skills\\articles-research-way\\SKILL.md. Resolve writing/image guidance through the configured .codex skill router; follow blogs.md and the built-in imagegen skill. If a required skill cannot be read, do not draft; report the blocker. Do not scan the full skills tree.\n\nPURPOSE AND ROUTES\nWork in D:\\backup\\website-zetasoftware. Publish four new bilingual EN/CN blog pairs dated for the current local day. This site calls them Blogs and uses /blogs/ and /cn/blogs/; never create /news/ routes.\n\nPROJECT REVIEW BEFORE EDITING\nRead blogs.md, status.md, README.md, meta.md, project-maintenance.md, website-content-knowledge-cn.md, both homepages and blog indexes, data/blogs.json, data/blogs-cn.json, data/blogs-cn-additional.json, all existing titles/slugs, recent batches, newest detail pages, and relevant topic-writer, image, homepage-feed, validation, and page-generation scripts. Use current project files as truth. Map candidate search intents to existing articles before selecting topics; reject exact duplicates and near-duplicates that would compete for the same reader question unless the new article adds a clearly distinct, evidence-backed answer.\n\nTOPIC DISCOVERY: MARKET SEARCHES + REAL READER NEEDS\nUse the read-only Keyword Planner sheet when accessible: https://docs.google.com/spreadsheets/d/16Seh_m7gplqsp8z5E7ZFUl17G-m66IFpLvtaPqtx9MI/edit?gid=2048567051#gid=2048567051 (tab: zetasoftware.my). Do not edit the sheet. Also check current Search Console, site analytics, Google Trends, customer questions, and sales/support questions only where the data is accessible and authorized. For every dataset, record its date, platform, geography, language, time range, and metric scope. Do not imply unavailable tools/data were checked.\n\nFind a broad set of current search topics that match Zeta Software's verified services and Malaysian/Johor business readers. Explore real phrases and questions in English, Simplified Chinese, and Malay where available; distinguish language and geography instead of translating one keyword set and treating it as equivalent demand. Consider relevant service and problem clusters such as custom websites/apps, CRM, ERP, WMS, inventory, POS, MRP, HR, and workflow automation only where supported by project evidence. Look for the exact decision, task, or pain behind a phrase: selection, comparison, implementation, integration, cost factors, migration, security, maintenance, or a current local change. Treat Keyword Planner search ranges as estimates; its ad competition and bid metrics are not organic ranking difficulty or proof of buyers. Google Trends is relative interest, not search volume or readership. Search suggestions and communities are qualitative discovery, not complete or ranked demand datasets.\n\nResearch ten distinct candidate topics, not ten minor keyword variations. For each, record: the intended Malaysian/Johor reader; the specific question to answer; the English/Chinese/Malay query or intent cluster when supported; source and dataset links; publisher/tool and checked date; publication/update date and geography; what the evidence supports; recency; fit with Zeta's verified services; how it differs from existing articles; and evidence gaps. Open primary or authoritative sources and read the relevant material, not search snippets alone. Prefer regulators, government agencies, official product documentation, original data, and strong independent reporting where needed. Never state that a topic is “top,” “most searched,” “trending,” or popular unless comparable current data supports that exact claim. Present the ten as an editorial shortlist when no comparable ranking exists.\n\nSelect four genuinely distinct, useful topics by reader need, business fit, evidence quality, freshness, originality, and answerability—not search volume alone. Prefer a mix of high-intent software/service questions and timely local business issues where the evidence justifies them; do not force a trend or a service pitch. Use one article per distinct reader intent. If search-demand datasets are unavailable, use verified user questions, source-backed current issues, and project evidence; clearly report that limitation. Do not invent demand or fill slots with thin variants.\n\nTITLE, SUMMARY, AND META QUALITY\nWrite modern, clear, natural titles for the actual question, in the audience's language. Make the promise concrete: state who the article helps and what decision, task, or outcome it clarifies. Use a current search phrase naturally when relevant, but avoid keyword stuffing, vague trend bait, exaggerated urgency, generic “ultimate guide” phrasing, unsupported superlatives, clickbait, and title templates repeated across the batch. Include Malaysia/Johor only when it materially improves scope or accuracy. Keep titles distinct from all existing English and Chinese titles.\n\nCreate article-specific short descriptions/excerpts and metaTitle/metaDescription that accurately match the body and intended query. The description should quickly explain the problem, useful answer, and any important scope limit; it must not merely repeat the title or use generic promotion. Meta titles should be readable and specific; meta descriptions should be concise, compelling, and factual without promises of rankings, sales, savings, eligibility, or outcomes. Fully localize Chinese title, excerpt, description, metaTitle, metaDescription, and article body into natural Simplified Chinese using locally appropriate search wording; do not produce a literal English translation. Keep the same facts, evidence, caveats, and jurisdiction scope in both languages.\n\nARTICLE CONTENT\nWrite at least 300 English words per article, but do not pad to reach a count. Answer the reader's central question directly in the first 40–80 words. Then give useful reasoning and practical steps, trade-offs/limitations, a clearly labeled illustrative hypothetical example (never imply a real client), a practical checklist, and a next action. Add information beyond a summary of other pages through careful synthesis, local context, or a useful decision method. Keep claims and links close to the evidence they support. Preserve the project's fields and paragraph-only contentHtml contract. Use current official sources for legal, tax, payment, privacy, or security claims; state jurisdiction/applicability and avoid individualized advice. Never invent client stories, prices, credentials, quotations, results, reviews, company capabilities, or service areas.\n\nFor every source, record direct URL, publisher, publication/update date (or explicitly say the official page shows no date), geography, and the precise claim it supports. Distinguish confirmed facts, attributed statements, interpretation, and unknowns. If important wording, eligibility, dates, or source terms cannot be checked, replace the source or disclose the gap and do not make the unsupported claim. Keep links in the dated research note and batch writer.\n\nIMAGES\nGenerate one distinct editorial image per article with the built-in image generator. First inspect the actual blog-card and detail-image boxes, responsive crop behavior, and relevant CSS at desktop/mobile sizes, following the image-generation asset policy. Record the target selectors, rendered dimensions/aspect ratio, crop rule, and safe composition. Images should communicate the article's actual subject and audience in a modern editorial style, with realistic Malaysian business context when suitable. No logos, watermarks, fake readable interface text, invented signage, or private data. Do not infer which output belongs to which prompt from file order: visually inspect each output and map it to the article by image content. Validate that every source image exists and matches its manifest record before conversion. Save opaque JPG covers under images/blog/ at dimensions appropriate to the measured target and no larger than 900×900; each final file must be strictly below 200,000 bytes. Check final quality at the rendered size.\n\nSAFE WRITER AND PAGE GENERATION\nAdd a dated batch writer that validates next-unused IDs, unique slugs/image paths, and complete EN/CN pairing before writing. It must be safe to rerun without duplicates; any partial or conflicting pair must stop before writes. Run the dated writer, image preparation, image validator, and scripts/generate-blog-pages.js. Ensure the Chinese homepage merges data/blogs-cn.json and data/blogs-cn-additional.json before sorting, and both homepages show the newest three records. Update status.md and synchronize current totals, dated research sources, routes, and verification notes in README.md, meta.md, project-maintenance.md, blogs.md, and website-content-knowledge-cn.md.\n\nVERIFICATION\nRun the dated verifier and syntax checks. Verify bilingual ID/date/slug/image parity; unique IDs, slugs, and today's images; minimum English word count; Chinese localization and equivalent evidence/caveats; paragraph-only content; article-specific descriptions and metadata; explicit checklist and next action; newest-first indexes and homepage selection; eight detail routes; image dimensions/format/byte limits; and unique sitemap URLs. For generated HTML metadata, use the same escaping as scripts/generate-blog-pages.js. Verify both homepages, both blog indexes, and all eight new detail routes over local HTTP, reusing a healthy server or starting one at 127.0.0.1:8080. Confirm rerunning the dated writer adds no duplicates. Do not deploy or claim production rendering, indexing, ranking, or search performance.\n\nHANDOFF\nReport the four bilingual titles, target reader and question for each, why each topic was selected, dataset/source scope and limits, cover paths/dimensions/byte sizes, changed files, verifier and HTTP results, and anything external that remains unverified. State clearly if Search Console, analytics, Trends, or Keyword Planner data was inaccessible. Preserve this automation's existing daily schedule, ACTIVE status, and target thread. Keep future prompts free of first-run study notes."
