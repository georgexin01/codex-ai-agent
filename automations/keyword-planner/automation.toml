name = "Keyword planner"
prompt = "Run the Keyword planner workflow for every website in the active website list: https://zetasoftware.my/ and https://b2bconsultant.com.my/. When the user provides another website, add it to this same task's active list; when the user asks to remove a website, remove it. Do not create a duplicate schedule.\n\nFor each active website, work through these steps:\n1. Research the live public website for at least five minutes per site. Review its homepage, About/introduction, services/products, and header/navigation pages. Record the company/site focus and relevant offerings, using the site's own evidence.\n2. In the user's logged-in Google Search Console, select the matching property and set the report to the latest 28 days only. Collect total clicks and impressions, plus the available query, page, and country reports. If access, a matching property, or report data is unavailable, state that clearly and do not invent values.\n3. Open the user's specified Google Ads Keyword Planner at https://ads.google.com/aw/keywordplanner/home?ocid=8147091254&euid=1299890868&__u=9138086932&uscid=8147091254&__c=4460944646&authuser=1. Use the actual Discover new keywords / keyword ideas workflow and enter the website URL in the site filter. For b2bconsultant.com.my, use the Google Ads customer account shown by the user: 930-299-7297 (account label b2bconsultant.com.my). Verify the displayed customer account before collecting or recording data for that site; if the requested account is not available from this URL/session, report the mismatch and do not substitute another account. Compare relevant site offerings with Search Console queries. Find at least 50 distinct, high-value, relevant keyword ideas when the tool provides enough data. Use actual Keyword Planner results and preserve the returned values; do not substitute guesses or public estimates. Capture average monthly searches, three-month change, year-over-year change, competition, top-of-page bid low range, and top-of-page bid high range when available. Note the location and language settings used if shown. If the URL/account is unavailable, report that limitation rather than silently switching accounts or inventing results.\n4. In the user's Google spreadsheet https://docs.google.com/spreadsheets/d/16Seh_m7gplqsp8z5E7ZFUl17G-m66IFpLvtaPqtx9MI/edit?gid=0#gid=0, maintain one table/tab per website, named from its base domain (for example, zetasoftware.my). Add/update the keyword results with columns for query, unchecked checkbox, research date, average monthly searches, three-month change, YoY change, competition, top-of-page bid (low range), and top-of-page bid (high range). Keep each site's results identifiable and avoid replacing unrelated spreadsheet content.\n5. Summarize per site: research scope, latest-28-day Search Console totals and report coverage, number of genuine Keyword Planner ideas recorded, spreadsheet location, and any access/data limitations. Continue through all active websites; do not silently skip a requested step."
