prompt = "Run the Keyword planner workflow for every website in the active target website list: https://zetasoftware.my/. When the user provides another target website, add it to this same task's active list; when the user asks to remove a target website, remove it. Do not create a duplicate schedule. This is the existing daily schedule; keep its current cadence and active status.\n\nPermanent target and spreadsheet rule: b2bconsultant.com.my is never an active research target and must never have a keyword table/tab created for it. The user uses Google Ads customer account 930-299-7297 (account label b2bconsultant.com.my) only as the Ads account context for Keyword Planner research on other target websites. It is not the target website. For every target website, enter that target website's URL in Keyword Planner's site filter. Keep the B2B Ads account available for this account-context use if it is accessible; verify the displayed account before collecting or recording data, and if unavailable report that limitation without substituting another account. Never create a b2bconsultant.com.my spreadsheet tab, even when that is the Ads account label.\n\nFor each active target website, work through these steps:\n1. On Monday, research the live public website for at least five minutes per site. Review its homepage, About/introduction, services/products, and header/navigation pages. Record the company/site focus and relevant offerings, using the site's own evidence. On Thursday, check those pages for meaningful changes and refresh only changed evidence; if no material changes are found, carry forward Monday's evidence and state that it was checked.\n2. In the user's logged-in Google Search Console, select the matching property and set the report to the latest 28 days only. Collect total clicks and impressions, plus the available query, page, and country reports. If access, a matching property, or report data is unavailable, state that clearly and do not invent values.\n3. Assess the Search Console queries against the site's offerings. If query coverage is sparse, repetitive, or mostly branded/off-topic, research relevant public companies and trustworthy industry resources related to the target site's industry. Review their public service/product language and customer problems to identify additional commercially relevant, revenue- or conversion-intent seed phrases. Use this external research only to expand discovery and explain the recommendations with source URLs; never present competitor phrases as the user's Search Console queries or as measured search demand. Keep suggestions directly relevant to the target site's own offerings and audience. Apply the relevant local .codex research guidance, especially articles-research-way and seo-ai-search, to distinguish observed user language, researched topic ideas, and measured demand.\n4. Learn from real audience language: use available Search Console query wording and trustworthy industry evidence, plus current official search-platform guidance about helpful answers and AI/search experiences (Google Search Central and, when useful, Bing Webmaster guidance). Look for natural question patterns about the target site's actual company, projects, services, products, problems solved, pricing/process, and local applicability. Treat platform guidance as general advice, not proof that a particular phrase has demand. Avoid invented user behavior claims or SEO guarantees.\n5. Open the user's specified Google Ads Keyword Planner at https://ads.google.com/aw/keywordplanner/home?ocid=8147091254&euid=1299890868&__u=9138086932&uscid=8147091254&__c=4460944646&authuser=1. Use the actual Discover new keywords / keyword ideas workflow and enter the active target website's URL in the site filter. Use the user's Google Ads customer account 930-299-7297 (account label b2bconsultant.com.my) as account context only when available; it is not a target for research. Use relevant Search Console queries plus evidence-based commercial seed phrases from steps 3–4 to guide discovery. Keep each stored query at least two words long; exclude single-word ideas even if the tool returns them. Preserve each qualifying phrase as Keyword Planner returned it: do not fabricate, mechanically translate, or append question marks to make a phrase look like a question. Aim for about 40% of recorded ideas to be natural question-style queries about relevant offerings or customer needs, when the tool returns enough genuine qualifying ideas. Prioritize relevant question ideas from real query wording and supported seed themes; if fewer are available, record only genuine results and report the actual question count/share and why the target was not met.\n6. Research across English, Chinese, and Malay audience language, and the markets Malaysia (including Johor/Johor Bahru when the Planner exposes those locations) and Singapore. Use natural terms in each language based on site evidence and audience usage, not literal translations. The zetasoftware.my spreadsheet tab must contain actual qualifying query rows in English, Chinese, and Malay during each Monday–Thursday weekly cycle when Keyword Planner supports those languages and returns relevant ideas; do not leave the sheet English-only while reporting multilingual settings. Distribute the 50 total ideas across the three languages when enough genuine results exist. If one language has no available relevant results, report that limitation clearly instead of translating phrases or inventing data. Configure a separate Keyword Planner run for each language/location context that is available and relevant; never combine or compare metrics collected under different settings as if they were one dataset. Across the Monday and Thursday runs each week, cover English, Chinese, and Malay, and include Malaysia (including Johor/Johor Bahru when available) and Singapore. Rotate relevant language-location pairings so every language group and each market is represented during the week; do not imply that every possible pairing was measured if it was not. If time, interface, account, or data limits prevent full coverage in one run, rotate the missing contexts across the next scheduled run and clearly name which language and location combinations were actually covered. Preserve the selected location, language, network, and date range with each result using a note on its Query cell when supported, so the existing sheet columns remain unchanged. If notes cannot be added, disclose the missing context in the run summary.\n7. For each active target website, aim for at least 50 distinct, high-value, relevant query phrases total across all setting contexts in that run, when the tool provides enough data—not 50 per context. If a phrase is returned under multiple settings, keep its separate rows and exact metrics with their context notes, but do not count repeated copies of that phrase as distinct ideas. Rank the sheet rows with the strongest recommendations first using this evidence order: direct fit to the site's actual services/products and audience; clear commercial or problem-solving intent; local and language relevance; then actual Keyword Planner search volume/trend and bid indicators. Do not treat advertising bid or competition as proof of revenue, conversion, or organic ranking potential. Capture average monthly searches, three-month change, year-over-year change, competition, top-of-page bid low range, and top-of-page bid high range when available. Preserve actual returned values; do not substitute guesses or public estimates. If URL/account/settings are unavailable, report that limitation rather than silently switching accounts, languages, locations, or inventing results.\n8. In the user's Google spreadsheet https://docs.google.com/spreadsheets/d/16Seh_m7gplqsp8z5E7ZFUl17G-m66IFpLvtaPqtx9MI/edit?gid=0#gid=0, maintain one table/tab per active target website, named from its base domain (for example, zetasoftware.my), but never create a b2bconsultant.com.my table/tab. Keep the header row exactly in this order and spelling: Query | Monthly Searches (Avg) | 3 Month Change | YoY Change | Competition | Top-of-page Bid (low range) | Top-of-page Bid (high range) | Date | options. Keep all nine header cells bold. Put research date values under Date (column H). Put unchecked Google Sheets checkboxes in the options column (column I); do not rename or move these columns. Add/update only genuine qualifying Keyword Planner results, preserving their returned values and without replacing unrelated spreadsheet content. Keep recommendations first in row order. Store geography/language context and, if feasible, intent/recommendation rationale as notes on the Query cells instead of adding columns or changing the header.\n9. Summarize per active target website: research scope; latest-28-day Search Console totals and report coverage; research-source URLs and seed themes when used; language/location/network/date contexts actually covered; genuine Keyword Planner idea count and question-style share; spreadsheet location; and any access/data limitations. Make progress visible with a concise stage-by-stage status for website review, Search Console, Keyword Planner, and spreadsheet update, marking each complete, blocked, or not reached and naming the next step for any blocker. Continue through all active target websites; do not silently skip a requested step."
