prompt = "Run the Keyword planner workflow for every website in the active target website list: https://zetasoftware.my/. When the user provides another target website, add it to this same task's active list; when the user asks to remove a target website, remove it. Do not create a duplicate schedule. This is the existing daily schedule; keep its current cadence and active status.\n\nPermanent target and spreadsheet rule: b2bconsultant.com.my is never an active research target and must never have a keyword table/tab created for it. The user uses Google Ads customer account 930-299-7297 (account label b2bconsultant.com.my) only as the Ads account context for Keyword Planner research on other target websites. It is not the target website. For every target website, enter that target website's URL in Keyword Planner's site filter. Keep the B2B Ads account available for this account-context use if it is accessible; verify the displayed account before collecting or recording data, and if unavailable report that limitation without substituting another account. Never create a b2bconsultant.com.my spreadsheet tab, even when that is the Ads account label.\n\nFor each active target website, work through these steps:\n1. Research the live public website for at least five minutes per site. Review its homepage, About/introduction, services/products, and header/navigation pages. Record the company/site focus and relevant offerings, using the site's own evidence.\n2. In the user's logged-in Google Search Console, select the matching property and set the report to the latest 28 days only. Collect total clicks and impressions, plus the available query, page, and country reports. If access, a matching property, or report data is unavailable, state that clearly and do not invent values.\n3. Assess the Search Console queries against the site's offerings. If query coverage is sparse, repetitive, or mostly branded/off-topic, research relevant public companies and trustworthy industry resources related to the target site's industry. Review their public service/product language and customer problems to identify additional commercially relevant, revenue- or conversion-intent seed phrases. Use this external research only to expand discovery and explain the recommendations with source URLs; never present competitor phrases as the user's Search Console queries or as measured search demand. Keep suggestions directly relevant to the target site's own offerings and audience.\n4. Open the user's specified Google Ads Keyword Planner at https://ads.google.com/aw/keywordplanner/home?ocid=8147091254&euid=1299890868&__u=9138086932&uscid=8147091254&__c=4460944646&authuser=1. Use the actual Discover new keywords / keyword ideas workflow and enter the active target website's URL in the site filter. Use the user's Google Ads customer account 930-299-7297 (account label b2bconsultant.com.my) as account context only when available; it is not a target for research. Use relevant Search Console queries plus evidence-based commercial seed phrases from step 3 to guide discovery. Find at least 50 distinct, high-value, relevant keyword ideas when the tool provides enough data. Use actual Keyword Planner results and preserve returned values; do not substitute guesses or public estimates. Capture average monthly searches, three-month change, year-over-year change, competition, top-of-page bid low range, and top-of-page bid high range when available. Note location and language settings when shown. If URL/account is unavailable, report that limitation rather than silently switching accounts or inventing results.\n5. In the user's Google spreadsheet https://docs.google.com/spreadsheets/d/16Seh_m7gplqsp8z5E7ZFUl17G-m66IFpLvtaPqtx9MI/edit?gid=0#gid=0, maintain one table/tab per active target website, named from its base domain (for example, zetasoftware.my), but never create a b2bconsultant.com.my table/tab. Keep the header row exactly in this order and spelling: Query | Monthly Searches (Avg) | 3 Month Change | YoY Change | Competition | Top-of-page Bid (low range) | Top-of-page Bid (high range) | Date | options. Keep all nine header cells bold. Put research date values under Date (column H). Put unchecked Google Sheets checkboxes in the options column (column I); do not rename or move these columns. Add/update only genuine Keyword Planner results, preserving their returned values and without replacing unrelated spreadsheet content.\n6. Summarize per active target website: research scope, latest-28-day Search Console totals and report coverage, number of genuine Keyword Planner ideas recorded, spreadsheet location, relevant external research sources and recommended seed themes when used, and any access/data limitations. Continue through all active target websites; do not silently skip a requested step."
